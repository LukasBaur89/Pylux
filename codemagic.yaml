workflows:
  pxsharp:
    name: PXSharp
    instance_type: mac_mini_m2
    max_build_duration: 120
    triggering:
      events: []
      cancel_previous_builds: true
    environment:
      vars:
        BUILD_NUM: "2018"
      xcode: latest
    scripts:
      - name: Werkzeuge
        script: |
          brew install cmake ninja protobuf@29 python-setuptools libplacebo || true
          brew list libplacebo >/dev/null 2>&1 || brew install --force-bottle libplacebo || true
      - name: PXSharp bauen
        script: |
          chmod +x ci/build_ios.sh
          bash ci/build_ios.sh
    artifacts:
      - out/*.ipa
      - out/Payload/Pylux.app
