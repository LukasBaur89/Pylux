                              .font(.system(size: 12, weight: .semibold))
                              .foregroundColor(.white.opacity(0.8))
                          Slider(value: $master, in: 0...2).tint(.white)
                          Text(String(format: "%.0f%%", master * 100))
                              .font(.system(size: 12, design: .monospaced))
