                      if UserDefaults.standard.object(forKey: "pxSharpTunedV4") == nil {
                          UserDefaults.standard.set(true, forKey: "pxSharpTunedV4")
                          if mode != 11 && mode != 12 {
                              mode = 11
                              SharpnessRow.applyPreset(11)
