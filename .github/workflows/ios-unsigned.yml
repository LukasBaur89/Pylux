                      vec4 c = sample(src, samplerTransform(src, p));
                      vec2 d = vec2(r, r);
                      vec3 a = sample(src, samplerTransform(src, p + vec2(-d.x, -d.y))).rgb;
                      vec3 b = sample(src, samplerTransform(src, p + vec2( 0.0, -d.y))).rgb;
                      vec3 e = sample(src, samplerTransform(src, p + vec2( d.x, -d.y))).rgb;
                      vec3 f = sample(src, samplerTransform(src, p + vec2(-d.x,  0.0))).rgb;
                      vec3 g = sample(src, samplerTransform(src, p + vec2( d.x,  0.0))).rgb;
                      vec3 h = sample(src, samplerTransform(src, p + vec2(-d.x,  d.y))).rgb;
                      vec3 i = sample(src, samplerTransform(src, p + vec2( 0.0,  d.y))).rgb;
                      vec3 j = sample(src, samplerTransform(src, p + vec2( d.x,  d.y))).rgb;
                      vec3 avg = (a + b + e + f + g + h + i + j) * 0.125;
                      vec3 L = vec3(0.2126, 0.7152, 0.0722);
                      float y  = dot(c.rgb, L);
                      float ya = dot(avg, L);
                      vec3 cc = c.rgb - vec3(y);
                      vec3 ca = avg  - vec3(ya);
                      vec3 delta = cc - ca;
                      float m = length(delta);
                      float k = max(0.0, m - coring) / max(m, 1e-5);
                      // In dunklen Bereichen KEINE Farbschaerfung: dort verstaerkt sie
                      // nur Farbstiche und Kompressionsrauschen (gemessen: Schatten
                      // wurden dadurch deutlich waermer). Erst ab 3 % Helligkeit
                      // einblenden, ab 15 % volle Wirkung.
                      float lumaC = dot(c.rgb, vec3(0.2126, 0.7152, 0.0722));
                      float lumaGate = smoothstep(0.03, 0.15, lumaC);
                      vec3 outv = c.rgb + delta * (amount * k * lumaGate);
                      // Halo-Begrenzung wie bei NVIDIA NIS/CAS: die Farbe darf den
                      // lokalen Nachbarschaftsbereich nicht verlassen. Ohne das
                      // entstehen farbige Raender an weisser Schrift (gemessen:
                      // rote Saeume um UI-Text, orange Ringe um Buttons).
                      vec3 mn = min(min(min(a, b), min(e, f)), min(min(g, h), min(i, j)));
                      vec3 mx = max(max(max(a, b), max(e, f)), max(max(g, h), max(i, j)));
                      vec3 span = mx - mn;
                      outv = clamp(outv, mn - span * 0.02, mx + span * 0.02);
                      return vec4(clamp(outv, vec3(0.0), vec3(1.0)), c.a);
                  }
                  """
                  chromaKernel = CIKernel(source: src)
                  if chromaKernel == nil { os_log(.error, log: videoViewLog, "[px] chroma kernel compile failed") }
                  return chromaKernel
              }

              private func cas2KernelInstance() -> CIKernel? {
                  if cas2Tried { return cas2Kernel }
                  cas2Tried = true
                  let src = """
                  kernel vec4 pxCAS2(sampler src, float r1, float r2, float s1, float s2, float clampK, float lumaOnly, float chromaS, float coring) {
                      vec2 p = destCoord();
                      vec4 c = sample(src, samplerTransform(src, p));
                      vec2 d1 = vec2(r1, r1);
                      vec4 a1 = sample(src, samplerTransform(src, p + vec2(-d1.x, -d1.y)));
                      vec4 b1 = sample(src, samplerTransform(src, p + vec2( 0.0, -d1.y)));
                      vec4 c1 = sample(src, samplerTransform(src, p + vec2( d1.x, -d1.y)));
                      vec4 d1s = sample(src, samplerTransform(src, p + vec2(-d1.x,  0.0)));
                      vec4 e1 = sample(src, samplerTransform(src, p + vec2( d1.x,  0.0)));
                      vec4 f1 = sample(src, samplerTransform(src, p + vec2(-d1.x,  d1.y)));
                      vec4 g1 = sample(src, samplerTransform(src, p + vec2( 0.0,  d1.y)));
                      vec4 h1 = sample(src, samplerTransform(src, p + vec2( d1.x,  d1.y)));
                      vec2 d2 = vec2(r2, r2);
                      vec4 a2 = sample(src, samplerTransform(src, p + vec2(-d2.x, -d2.y)));
                      vec4 b2 = sample(src, samplerTransform(src, p + vec2( 0.0, -d2.y)));
                      vec4 c2 = sample(src, samplerTransform(src, p + vec2( d2.x, -d2.y)));
                      vec4 d2s = sample(src, samplerTransform(src, p + vec2(-d2.x,  0.0)));
                      vec4 e2 = sample(src, samplerTransform(src, p + vec2( d2.x,  0.0)));
                      vec4 f2 = sample(src, samplerTransform(src, p + vec2(-d2.x,  d2.y)));
                      vec4 g2 = sample(src, samplerTransform(src, p + vec2( 0.0,  d2.y)));
                      vec4 h2 = sample(src, samplerTransform(src, p + vec2( d2.x,  d2.y)));

                      vec3 mn = min(min(min(b1.rgb, d1s.rgb), min(e1.rgb, g1.rgb)),
                                    min(min(a1.rgb, c1.rgb), min(f1.rgb, h1.rgb)));
                      vec3 mx = max(max(max(b1.rgb, d1s.rgb), max(e1.rgb, g1.rgb)),
                                    max(max(a1.rgb, c1.rgb), max(f1.rgb, h1.rgb)));
                      vec3 avg1 = (b1.rgb + d1s.rgb + e1.rgb + g1.rgb
                                 + a1.rgb + c1.rgb + f1.rgb + h1.rgb) * 0.125;
                      vec3 avg2 = (b2.rgb + d2s.rgb + e2.rgb + g2.rgb
                                 + a2.rgb + c2.rgb + f2.rgb + h2.rgb) * 0.125;
                      vec3 range = mx - mn;
                      vec3 adapt = vec3(1.0) - clamp(range * 4.0, vec3(0.0), vec3(1.0));
                      vec3 edge;
                      vec3 tex;
                      if (lumaOnly > 0.5) {
                          vec3 L = vec3(0.299, 0.587, 0.114);
                          float lc2 = dot(c.rgb, L);
                          float a = dot(adapt, vec3(0.333333));
                          // CORING: alles unter dem Rauschpegel wird auf Null gesetzt,
                          // echte Textur bleibt — Schaerfe ohne Rauschverstaerkung.
                          float v1 = lc2 - dot(avg1, L);
                          float v2 = lc2 - dot(avg2, L);
                          v1 = sign(v1) * max(0.0, abs(v1) - coring);
                          v2 = sign(v2) * max(0.0, abs(v2) - coring);
                          edge = vec3(v1 * (s1 * (0.45 + 0.55 * a)));
                          tex  = vec3(v2 * s2);
                          if (chromaS > 0.001) {
                              vec3 cc = c.rgb - vec3(lc2);
                              vec3 ca = avg2 - vec3(dot(avg2, L));
                              tex += (cc - ca) * chromaS;
                          }
                      } else {
                          vec3 w1 = c.rgb - avg1;
                          vec3 w2 = c.rgb - avg2;
                          w1 = sign(w1) * max(vec3(0.0), abs(w1) - coring);
                          w2 = sign(w2) * max(vec3(0.0), abs(w2) - coring);
                          edge = w1 * (s1 * (0.45 + 0.55 * adapt));
                          tex  = w2 * s2;
                      }
                      // Banding-Schutz: Treppenstufen sind Kanten mit 1-4 Stufen Amplitude.
                      // smoothstep blendet die Schaerfung dort aus, laesst Textur stehen.
                      float bandC = dot(range, vec3(0.299, 0.587, 0.114));
                      float bandGuard = smoothstep(0.0025, 0.020, bandC);
                      vec3 outv = c.rgb + (edge + tex) * bandGuard;
                      vec3 lim  = range * clampK + 0.003;
                      outv = clamp(outv, mn - lim, mx + lim);
                      return vec4(clamp(outv, vec3(0.0), vec3(1.0)), c.a);
                  }
                  """
                  cas2Kernel = CIKernel(source: src)
                  if cas2Kernel == nil { os_log(.error, log: videoViewLog, "[px] cas2 kernel compile failed") }
                  return cas2Kernel
              }

              /// Lokales Dimming (Mini-LED-Emulation). Ein echter Mini-LED-Fernseher dimmt
              /// die Hintergrundbeleuchtung zonenweise: dunkle Bildbereiche bekommen weniger
              /// Licht, helle bleiben stehen. Ergebnis sind tiefe Schwärzen und ein deutlich
              /// höherer Eindruck von Kontrast, ohne dass die Mitteltöne flach werden.
              /// Hier wird dafür eine stark verkleinerte Luma-Karte weichgezeichnet und als
              /// Verstärkungsfaktor auf das Bild gelegt — der Radius entspricht einer
              /// Dimming-Zone, nicht einem Pixel.
              private func localDimKernelInstance() -> CIColorKernel? {
                  if ldTried { return ldKernel }
                  ldTried = true
                  let src = """
                  kernel vec4 pxLocalDim(__sample c, __sample map, float strength, float knee, float lift) {
                      float l = dot(map.rgb, vec3(0.2126, 0.7152, 0.0722));
                      float t = smoothstep(0.0, knee, l);
                      float gain = 1.0 - strength * (1.0 - t);
                      vec3 o = c.rgb * gain + vec3(lift * (1.0 - t));
                      return vec4(clamp(o, vec3(0.0), vec3(1.0)), c.a);
                  }
                  """
                  ldKernel = CIColorKernel(source: src)
                  return ldKernel
              }

              // MARK: - Kanten-Upscaler (Core Image, ohne MetalFX)

              /// Kantenbewusstes Hochskalieren als CIKernel. Basis ist bewusst die
              /// bilineare Abtastung (immer gueltig), darauf kommt ein Detailzuschlag,
              /// der auf die lokale Min/Max-Spanne begrenzt wird. Dadurch sind Halos
              /// konstruktiv ausgeschlossen — anders als bei Lanczos, das ueber Kanten
              /// hinausschwingt.
              private func upscaleKernelInstance() -> CIKernel? {
                  if upTried { return upKernel }
                  upTried = true
                  let src = """
                  kernel vec4 pxUpscale(sampler src, float invScale, float sharp, float clampK) {
                      vec2 p = destCoord() * invScale;
                      vec2 b = floor(p) + 0.5;
                      vec4 c = sample(src, p);
                      vec4 s0 = sample(src, b + vec2(-0.5, -0.5));
                      vec4 s1 = sample(src, b + vec2( 0.5, -0.5));
                      vec4 s2 = sample(src, b + vec2(-0.5,  0.5));
                      vec4 s3 = sample(src, b + vec2( 0.5,  0.5));
                      vec4 mn = min(min(s0, s1), min(s2, s3));
                      vec4 mx = max(max(s0, s1), max(s2, s3));
                      vec4 avg = (s0 + s1 + s2 + s3) * 0.25;
                      vec4 detail = c - avg;
                      vec4 lim = (mx - mn) * clampK;
                      detail = clamp(detail, -lim, lim);
                      vec3 o = c.rgb + detail.rgb * sharp;
                      o = clamp(o, mn.rgb, mx.rgb);
                      return vec4(clamp(o, vec3(0.0), vec3(1.0)), c.a);
                  }
                  """
                  upKernel = CIKernel(source: src)
                  return upKernel
              }

              // MARK: - Lokale Tonwertspreizung (Object-Based HDR Remaster)

              /// Ein Spitzenfernseher hellt das Bild nicht global auf, sondern RAEUMLICH:
              /// Partien unter der Szenenmitte werden tiefer, Partien darueber bleiben
              /// hell. Dadurch entsteht Tiefenwirkung, ohne dass das Bild flau oder
              /// ausgewaschen wirkt. Die Karte ist stark unscharf (1/16 Aufloesung,
              /// grosser Radius), damit keine Kantenhoefe entstehen.
              private func toneKernelInstance() -> CIColorKernel? {
                  if toneTried { return toneKernel }
                  toneTried = true
                  let src = """
                  kernel vec4 pxLocalTone(__sample c, __sample map, float strength, float ref) {
                      float l = dot(map.rgb, vec3(0.2126, 0.7152, 0.0722));
                      float ratio = clamp(l / max(ref, 0.05), 0.30, 2.5);
                      float g = pow(ratio, strength);
                      g = clamp(g, 0.78, 1.30);
                      vec3 o = c.rgb * g;
                      float m = max(max(o.r, o.g), o.b);
                      float hi = clamp((m - 0.84) * 5.0, 0.0, 0.65);
                      o = mix(o, min(o, vec3(0.995)), hi);
                      return vec4(clamp(o, vec3(0.0), vec3(1.0)), c.a);
                  }
                  """
                  toneKernel = CIColorKernel(source: src)
                  return toneKernel
              }

              private func applyLocalTone(_ input: CIImage, strength: Float, ref: Float) -> CIImage {
                  guard strength > 0.01, let k = toneKernelInstance() else { return input }
                  let ext = input.extent
                  let s: CGFloat = 1.0 / 16.0
                  let small = input.transformed(by: CGAffineTransform(scaleX: s, y: s))
                  let blurred = small.applyingFilter("CIGaussianBlur", parameters: [
                      kCIInputRadiusKey: 3.0
                  ]).cropped(to: small.extent)
                  let up = blurred.transformed(by: CGAffineTransform(scaleX: 1.0 / s, y: 1.0 / s))
                  if let out = k.apply(extent: ext, arguments: [
                      input, up, NSNumber(value: strength), NSNumber(value: ref)
                  ]) {
                      return out
                  }
                  return input
              }

              private func applyLocalDimming(_ input: CIImage, strength: Float, zone: CGFloat) -> CIImage {
                  guard strength > 0.02, let lc = localDimKernelInstance() else { return input }
                  let ext = input.extent
                  let s = 1.0 / max(zone, 2.0)
                  // Wichtig: echtes Herunterskalieren mit Tiefpass. Ein bilineares
                  // transformed(by:) wuerde bei Faktor 36 nur jedes 36. Pixel abtasten und
                  // eine verrauschte Zonenkarte erzeugen (fleckiges Dimming).
                  let small = input.applyingFilter("CILanczosScaleTransform", parameters: [
                      kCIInputScaleKey: s,
                      kCIInputAspectRatioKey: 1.0
                  ])
                  let blurred = small.applyingFilter("CIGaussianBlur", parameters: [
                      kCIInputRadiusKey: 3.0
                  ]).cropped(to: small.extent)
                  // Hochskalieren bewusst bilinear: die Karte ist bereits weichgezeichnet,
                  // Lanczos wuerde pro Panelpixel 36 Taps lesen und die Bildrate kosten.
                  let up = blurred.transformed(by: CGAffineTransform(scaleX: 1.0 / s, y: 1.0 / s))
                  if let out = lc.apply(extent: ext, arguments: [
                      input, up, NSNumber(value: strength), NSNumber(value: 0.30), NSNumber(value: 0.008)
                  ]) {
                      return out
                  }
                  return input
              }

              /// Kanten (luma-only), Textur und Klarheit — immer auf der finalen
              /// Panel-Auflösung, nie auf dem 1080p-Signal.
              /// Hitze-Schutz: bei "serious" wird die Klarheit halbiert und das neuronale
              /// Netz abgeschaltet, bei "critical" zusaetzlich die Schaerfe gedaempft.
              /// Das iPad drosselt sonst weiter, bis die Bildrate einbricht.
              private var cachedThermal: ProcessInfo.ThermalState = .nominal
              private var thermalCheckAt: CFTimeInterval = 0

              private func thermalScale() -> Float {
                  let now = CACurrentMediaTime()
                  if now - thermalCheckAt > 2.0 {
                      thermalCheckAt = now
                      cachedThermal = ProcessInfo.processInfo.thermalState
                  }
                  // Schaerfe bleibt IMMER voll. Nur bei kritischer Hitze wird leicht
                  // gedaempft, damit die App nicht abgeschaltet wird.
                  switch cachedThermal {
                  case .critical: return 0.6
                  default: return 1.0
                  }
              }

              private func thermalAllowsNeural() -> Bool {
                  let now = CACurrentMediaTime()
                  if now - thermalCheckAt > 2.0 {
                      thermalCheckAt = now
                      cachedThermal = ProcessInfo.processInfo.thermalState
                  }
                  // Das iPad schafft das Netz auch bei Waerme -- nur im Notfall aus.
                  return cachedThermal != .critical
              }

              /// Zaehlt gerenderte Bilder und schreibt die Rate nach /state.
              /// WICHTIG: muss in BEIDEN Pfaden laufen -- der MetalFX-Zweig verlaesst
              /// draw() vorher, dadurch standen fps und Renderzeit still (gemessen:
              /// 51 blieb konstant, auch bei eingefrorenem Bild).
              private func noteFrameRendered() {
                  frameCount += 1
                  let now = CACurrentMediaTime()
                  // Sitzung laeuft stabil -> kein Absturz, Zaehler loeschen. Nur so
                  // greift der Safe-Mode ausschliesslich bei echten Absturz-Schleifen.
                  if !markedHealthy, sessionStart > 0, now - sessionStart > 8.0 {
                      markedHealthy = true
                      UserDefaults.standard.set(0, forKey: "pxLaunchCount")
                  }
                  if now - fpsWindowStart >= 1.0 {
                      let fps = Double(frameCount) / (now - fpsWindowStart)
                      UserDefaults.standard.set(String(format: "%.0f", fps), forKey: "pxSharpFPS")
                      frameCount = 0
                      fpsWindowStart = now
                  }
              }

              /// Rendert jede gespeicherte Kette einzeln und misst die GPU-Zeit.
              /// Das ist der Ersatz fuer Instruments: dieselben Zahlen, von innen.
              private func measureProfile(space: CGColorSpace) {
                  guard let ctx = ciContext, let q = commandQueue, let device = metalView?.device else { return }
                  var ergebnis: [String: Double] = [:]
                  var vorher = 0.0
                  for (name, img) in profPrefixes {
                      let w = Int(img.extent.width), h = Int(img.extent.height)
                      guard w > 8, h > 8 else { continue }
                      let d = MTLTextureDescriptor.texture2DDescriptor(pixelFormat: .bgra8Unorm,
                                                                       width: w, height: h, mipmapped: false)
                      d.usage = [.renderTarget, .shaderRead]
                      d.storageMode = .private
                      guard let tex = device.makeTexture(descriptor: d),
                            let cb = q.makeCommandBuffer() else { continue }
                      let rect = CGRect(x: 0, y: 0, width: CGFloat(w), height: CGFloat(h))
                      ctx.render(img.cropped(to: rect), to: tex, commandBuffer: cb,
                                 bounds: rect, colorSpace: space)
                      cb.commit()
                      cb.waitUntilCompleted()
                      let ms = (cb.gpuEndTime - cb.gpuStartTime) * 1000.0
                      ergebnis[name] = ms
                      ergebnis["+" + name] = ms - vorher
                      vorher = ms
                  }
                  profPrefixes.removeAll()
                  let txt = ergebnis.sorted { $0.key < $1.key }
                      .map { "\($0.key)=\(String(format: "%.1f", $0.value))" }.joined(separator: " ")
                  UserDefaults.standard.set(txt, forKey: "pxProfileText")
              }

              private func applyDetailStage(_ input: CIImage, radiusScale: Float = 1.0) -> CIImage {
                  if UserDefaults.standard.bool(forKey: "pxSharpBypass") { return input }
                  var image = input
                  let level = Float(UserDefaults.standard.object(forKey: "pxSharpLevel") as? Double ?? 0.50)
                  let detail = Float(UserDefaults.standard.object(forKey: "pxSharpDetail") as? Double ?? 0.0)

                  let engineNew = (UserDefaults.standard.object(forKey: "pxSharpEngine") as? Int ?? 1) != 0
                  // In verrauschten Szenen weniger Schaerfe: sonst verstaerkt der CAS das
                  // Rauschen staerker, als es der Filter entfernen kann.
                  let autoFlag = (UserDefaults.standard.object(forKey: "pxSharpAuto") as? NSNumber)?.boolValue ?? false
                  let autoStr = Float(UserDefaults.standard.object(forKey: "pxSharpAutoStrength") as? Double ?? 0.65)
                  let autoNoise: Float = autoFlag ? Float(PXScene.shared.noise) * autoStr : 0
                  // Zusaetzlich: bei niedriger Bitrate weniger Schaerfe (Blockkanten).
                  // Die Bitrate wird hier separat gelesen (die Funktion hat keinen Zugriff
                  // auf die lokale Variable aus draw()).
                  let mbpsD = Double(UserDefaults.standard.string(forKey: "pxSharpStreamMbps") ?? "") ?? 0.0
                  var bfD: Float = 1.0
                  if mbpsD > 0.1 {
                      bfD = Float(min(max((mbpsD - 7.0) / 15.0, 0.0), 1.0))
                  }
                  // Schärfe-Dämpfung bei niedriger Bitrate: vorher wurden bei 8 Mbit nur
                  // 58 % der eingestellten Schärfe angewendet — das Bild war dadurch weich,
                  // obwohl der Regler auf 0,95 stand. Jetzt bleiben mindestens 75 %.
                  // Schaerfe haengt an der Bitrate: ab 12 Mbit volle Staerke (vorher erst
                  // ab 22 Mbit), darunter linear weniger. Nur unter 8 Mbit wird deutlich
                  // gedaempft -- dort besteht die Quelle aus Kompressionsbloecken.
                  let bfD2 = Float(min(max((mbpsD - 3.0) / 9.0, 0.0), 1.0))
                  // Untergrenze 35 % statt 55 %: bei 4-7 Mbit war die Schaerfe messbar zu
                  // stark (BRISQUE schlechter als die Quelle, Schaerfe-Index doppelt so
                  // hoch). Ab 12 Mbit unveraendert volle Staerke.
                  let sharpDamp = (1.0 - min(autoNoise * 0.30, 0.25)) * (0.35 + 0.65 * bfD2)
                  // Coring-Schwelle: Regler + gemessenes Rauschen der Szene.
                  // Coring-Schwelle: fast ausschliesslich vom GEMESSENEN Rauschen
                  // bestimmt. In einer sauberen Szene bleibt Textur voll erhalten, in
                  // einer verrauschten wird nur der Rauschteppich weggeschnitten.
                  let coringBase = (UserDefaults.standard.object(forKey: "pxSharpCoring") as? Double ?? 0.04)
                  let coringVal = Float(min(0.080, coringBase * 0.040 + Double(min(autoNoise, 1.0)) * 0.024))
                  var haloLimitD = Float(UserDefaults.standard.object(forKey: "pxSharpHalo") as? Double ?? 0.12)
                  let master = Float(min(max((UserDefaults.standard.object(forKey: "pxSharpMaster") as? Double) ?? 1.0, 0.0), 1.0))
                  let s1 = min(max(level, 0), 1) * 2.10 * sharpDamp * autoDetailScale * master
                  let s2 = min(max(detail, 0), 1) * 1.70 * sharpDamp * autoDetailScale * master
                  // Texturtiefe: vergroessert den zweiten Radius (2,7 -> 5,0 px auf dem
                  // Panel). Kleine Radien = Feinststruktur, grosse Radien = Texturtiefe
                  // (Gras, Stoff, Mauerwerk). Kostet keine zusaetzlichen Samples.
                  let texDepth = Float(min(max(UserDefaults.standard.object(forKey: "pxSharpTexDepth") as? Double ?? 0.0, 0.0), 1.0))
                  let r2v = 2.2 + 3.2 * texDepth
                  let s2v = s2 * (1.0 - 0.25 * texDepth)
                  // Je haerter geschaerft wird, desto enger wird der Ueberschwinger
                  // begrenzt. Gemessen: bei level 1.0 + detail 0.8 entstanden an Haaren
                  // vor hellem Himmel dunkle Saeume (1,05 % Unterschwinger).
                  let strengthNorm = min(1.0, (s1 + s2v) / 2.5)
                  haloLimitD *= (1.0 - 0.55 * strengthNorm)
                  if s1 > 0.02 || s2 > 0.02 {
                      if engineNew, let k = cas2KernelInstance() {
                          let halo: CGFloat = CGFloat(-8.0 * radiusScale)
                          let roi: CIKernelROICallback = { _, rect in rect.insetBy(dx: halo, dy: halo) }
                          if let out = k.apply(extent: image.extent, roiCallback: roi,
                                               arguments: [image, NSNumber(value: 1.35 * radiusScale), NSNumber(value: r2v * radiusScale),
                                                           NSNumber(value: s1), NSNumber(value: s2v), NSNumber(value: haloLimitD),
                                                           NSNumber(value: (UserDefaults.standard.object(forKey: "pxSharpLumaSharpen") as? NSNumber)?.boolValue ?? true),
                                                           NSNumber(value: (UserDefaults.standard.object(forKey: "pxSharpChroma") as? Double ?? 0.0)),
                                                           NSNumber(value: coringVal)]) {
                              image = out
                          } else {
                              // Fallback: falls der Kernel zur Laufzeit nicht durchlaeuft
                              image = image.applyingFilter("CIUnsharpMask", parameters: [
                                  kCIInputRadiusKey: CGFloat(1.4 * radiusScale),
                                  kCIInputIntensityKey: min(level, 1.0) * 1.25
                              ])
                          }
                      } else {
                          // Altpfad (pxSharpEngine=0): exakt die Kette aus Build 39.
                          if level > 0.02 {
                              image = image.applyingFilter("CIUnsharpMask", parameters: [
                                  kCIInputRadiusKey: 1.4,
                                  kCIInputIntensityKey: min(level, 1.0) * 1.25
                              ])
                          }
                          if detail > 0.02 {
                              image = image.applyingFilter("CIUnsharpMask", parameters: [
                                  kCIInputRadiusKey: 3.2,
                                  kCIInputIntensityKey: min(detail, 1.0) * 0.58
                              ])
                          }
                      }

                      // Richtungsabhaengige Nachschaerfung (NVIDIA-NIS-Prinzip).
                      // Gemessen an 2732 px: +8 % Detail bei WENIGER Ueberschwingern
                      // als die rundum wirkende Schaerfung. Ueber den Schalter
                      // "Richtungsschaerfe" abschaltbar.
                      let dirOn = (UserDefaults.standard.object(forKey: "pxSharpDirSharp") as? Bool) ?? true
                      let dirAmt = dirOn ? Float(0.60) * s1 : 0
                      if dirAmt > 0.02, let dk = dirSharpKernelInstance(),
                         let out = dk.apply(extent: image.extent,
                                            roiCallback: { _, rect in rect.insetBy(dx: -3, dy: -3) },
                                            arguments: [image, NSNumber(value: dirAmt), NSNumber(value: haloLimitD)]) {
                          image = out
                      }
                  }

                  return image
              }

              func draw(in view: MTKView) {
                  autoreleasepool { drawInner(in: view) }
              }

              private func drawInner(in view: MTKView) {
                  // ---- Panel-Aufloesung (Leistung) -----------------------------------
                  // 0,83 = 2266 px statt 2732 px: 31 % weniger Pixel zu rechnen. Bei Hitze
                  // haelt das die 60 fps, kostet rund 6 % Schaerfe. Der Layer skaliert die
                  // Textur bilinear auf die volle Flaeche — bei 2266 px nicht zu sehen.
                  let panelFactor: CGFloat = (UserDefaults.standard.object(forKey: "pxSharpPanel2x") as? Bool ?? false) ? 0.83 : 1.0
                  if abs(panelFactor - appliedPanelFactor) > 0.0001 {
                      appliedPanelFactor = panelFactor
                      let scale = window?.screen.scale ?? UIScreen.main.scale
                      let w = (bounds.width * scale * panelFactor).rounded(.down)
                      let h = (bounds.height * scale * panelFactor).rounded(.down)
                      if w > 0, h > 0 { view.drawableSize = CGSize(width: w, height: h) }
                  }

                  // HDR-Peak live nachziehen (Panel-Headroom ändert sich mit der Display-Helligkeit)
                  if hdrActive {
                      let peak = UserDefaults.standard.object(forKey: "pxSharpHdrPeak") as? Double ?? 600
                      if abs(peak - appliedPeak) > 0.5, let caml = view.layer as? CAMetalLayer {
                          caml.edrMetadata = CAEDRMetadata.hdr10(minLuminance: 0.005,
                                                                 maxLuminance: Float(peak),
                                                                 opticalOutputScale: 100)
                          appliedPeak = peak
                      }
                  }

                  guard let drawable = view.currentDrawable,
                        let cb = commandQueue?.makeCommandBuffer() else { return }

                  bufferLock.lock()
                  let pb = latestBuffer
                  bufferLock.unlock()
                  guard let pixelBuffer0 = pb else { return }
                  PXProbe.shared.note(pixelBuffer0)
                  // Stream laeuft -> Startzaehler zuruecksetzen (kein Safe-Mode noetig).
                  if UserDefaults.standard.integer(forKey: "pxLaunchCount") > 0 {
                      UserDefaults.standard.set(0, forKey: "pxLaunchCount")
                  }
                  // Szenenanalyse fuer die Automatik (Belichtung, Rauschen).
                  PXScene.shared.analyze(PXProbe.shared.frozenBuffer ?? pixelBuffer0)
                  let pixelBuffer = PXProbe.shared.frozenBuffer ?? pixelBuffer0

                  let target = CGSize(width: drawable.texture.width, height: drawable.texture.height)
                  guard target.width > 0, target.height > 0 else { return }

                  var image: CIImage
                  // KI-Upscaler (Option): 1080p -> 2160p, danach nur noch der kleine
                  // Schritt auf die Panelbreite. Standard: aus. Wenn das Netz nicht
                  // laedt oder zu langsam ist, bleibt der normale Weg.
                  var sourceBuffer = pixelBuffer
                  // Bitraten-Steuerung: das Netz hilft nur, wo die Quelle wirklich weich
                  // ist (unter ~18 Mbit). Darueber ist die Quelle besser als alles, was
                  // das Netz im Training gesehen hat -- gemessen: Textur -8 % bei 36 Mbit.
                  let mbpsGate = Double(UserDefaults.standard.string(forKey: "pxSharpStreamMbps") ?? "") ?? 0.0
                  let autoGate = (UserDefaults.standard.object(forKey: "pxSharpAiAutoBitrate") as? NSNumber)?.boolValue ?? true
                  let gateLimit = (UserDefaults.standard.object(forKey: "pxSharpAiGateMbit") as? Double) ?? 18.0
                  let netAllowed = !autoGate || mbpsGate <= 0.1 || mbpsGate < gateLimit
                  if !hdrActive, UserDefaults.standard.bool(forKey: "pxSharpAiUpscale"), netAllowed {
                      if UserDefaults.standard.integer(forKey: "pxSharpAiMode") == 3 {
                          // Luma-Netz: arbeitet direkt auf der Helligkeitsebene, ohne
                          // Farbumwandlung. Die Farbe wird unveraendert uebernommen.
                          if let l = PXLumaDetail.shared.process(pixelBuffer) { sourceBuffer = l }
                      } else if let up = PXAiUpscale.shared.upscale(pixelBuffer) {
                          sourceBuffer = up
                      }
                  }
                  if hdrActive, let pq = CGColorSpace(name: CGColorSpace.itur_2100_PQ) {
                      // 10-Bit-Buffer sind PQ-kodiert — explizit taggen, sonst nimmt CoreImage sRGB an
                      // und die PQ-Ausgabe wirkt weiß/ausgewaschen.
                      image = CIImage(cvPixelBuffer: sourceBuffer, options: [.colorSpace: pq])
                  } else {
                      // WICHTIG: SDR NICHT selbst taggen. VideoToolbox legt Matrix, Primaries und
                      // Range (16-235 vs 0-255) als Attachments an den Buffer. Ein hartes BT.709-Tag
                      // überschreibt die Range und drückt das Bild zusammen -> Schatten laufen zu.
                      image = CIImage(cvPixelBuffer: sourceBuffer)
                  }

                  // ---- Zeitliches Entrauschen (Nacht / niedrige Bitrate) --------------
                  // Bei 5-10 Mbit wirft der Encoder Bloecke weg und holt sie im naechsten
                  // Bild neu. Raeumlich sieht man das nicht -- es flackert zeitlich.
                  // Deshalb: aktuelles Bild mit dem vorherigen mischen, aber NUR dort,
                  // wo sich nichts bewegt hat (kleine Differenz). Bewegung bleibt scharf.
                  let tempAmt = (UserDefaults.standard.object(forKey: "pxSharpTemporal") as? Double) ?? 0.0
                  if tempAmt > 0.02, !hdrActive,
                     let tk = temporalKernelInstance(),
                     let prev = prevTemporalBuffer,
                     CVPixelBufferGetWidth(prev) == CVPixelBufferGetWidth(sourceBuffer),
                     CVPixelBufferGetHeight(prev) == CVPixelBufferGetHeight(sourceBuffer) {
                      let thr = CGFloat((UserDefaults.standard.object(forKey: "pxSharpTemporalThr") as? Double) ?? 0.10)
                      if let out = tk.apply(extent: image.extent,
                                            roiCallback: { _, rect in rect },
                                            arguments: [image, CIImage(cvPixelBuffer: prev),
                                                        NSNumber(value: tempAmt), NSNumber(value: thr)]) {
                          image = out
                      }
                  }
                  if tempAmt > 0.02, !hdrActive {
                      prevTemporalBuffer = PXProbe.copyBuffer(sourceBuffer)
                  } else if prevTemporalBuffer != nil {
                      prevTemporalBuffer = nil
                  }

                  // ---- Zeitliche Akkumulation (Mehrbild) -----------------------------
                  // Echte zusaetzliche Abtastpunkte aus 2-4 Bildern: die Kamera bewegt
                  // sich zwischen zwei Bildern um Bruchteile eines Pixels, dieselbe Kante
                  // liegt also jedes Mal anders. Ausgerichtet + geklemmt zusammengelegt
                  // ergibt das mehr Aufloesung, ohne Ueberschaerfung und ohne Halos.
                  let accumAmt = (UserDefaults.standard.object(forKey: "pxSharpAccum") as? Double) ?? 0.0
                  if accumAmt > 0.02, !hdrActive {
                      PXAccumulate.shared.estimate(sourceBuffer)
                      if let ak = accumKernelInstance(), let prevA = prevAccumBuffer,
                         CVPixelBufferGetWidth(prevA) == CVPixelBufferGetWidth(sourceBuffer) {
                          let thr = (UserDefaults.standard.object(forKey: "pxSharpAccumThr") as? Double) ?? 0.08
                          if let out = ak.apply(extent: image.extent,
                                                roiCallback: { _, rect in rect.insetBy(dx: -2, dy: -2) },
                                                arguments: [image, CIImage(cvPixelBuffer: prevA),
                                                            NSNumber(value: PXAccumulate.shared.shiftX),
                                                            NSNumber(value: PXAccumulate.shared.shiftY),
                                                            NSNumber(value: accumAmt), NSNumber(value: thr)]) {
                              image = out
                          }
                      }
                      prevAccumBuffer = PXProbe.copyBuffer(sourceBuffer)
                  } else if prevAccumBuffer != nil {
                      prevAccumBuffer = nil
                  }
                  let src = image.extent.size
                  guard src.width > 0, src.height > 0 else { return }
                  // A/B-Vergleich: schaltet JEDE Nachbearbeitung ab, damit man den
                  // Unterschied zwischen "verarbeitet" und "roh" direkt sieht.
                  let bypassNow = UserDefaults.standard.bool(forKey: "pxSharpBypass")

                  // QUALITAETS-WATCHDOG. Bekanntes Problem in chiaki: der Stream wird
                  // mit der Zeit schlechter, bis man die Verbindung neu aufbaut. Ein
                  // neues Keyframe holt die Qualitaet zurueck, ohne die Sitzung zu
                  // trennen. Faellt die Rate 6 Sekunden unter 7 Mbit, fordern wir eins an.
                  let rateNow = Double(UserDefaults.standard.string(forKey: "pxSharpStreamMbps") ?? "") ?? 0
                  if rateNow > 0.2 && rateNow < 7.0 {
                      lowRateAccum += 1.0 / 60.0
                      if lowRateAccum > 6.0 {
                          lowRateAccum = 0
                          PyluxVideoDecoderRequestKeyframe()
                          os_log(.default, log: videoViewLog, "[px] keyframe angefordert (%.1f Mbit)", rateNow)
                      }
                  } else {
                      lowRateAccum = 0
                  }

                  // ---- Bildautomatik ------------------------------------------------
                  // Misst jede Szene und korrigiert nur das, was messbar danebenliegt:
                  // ausgebrannte Lichter zuruecknehmen, abgesoffene Schwazen leicht
                  // anheben, Schaerfe bei Rauschen zuruecknehmen. Bewusst kleine
                  // Korridore (+-8 %), damit nichts pumpt.
                  let autoEngine = (UserDefaults.standard.object(forKey: "pxSharpAutoEngine") as? NSNumber)?.boolValue ?? true
                  var autoExpo: Double = 1.0
                  var autoLift: Double = 0.0
                  autoDetailScale = 1.0
                  if autoEngine && !bypassNow {
                      let sceneNow = PXScene.shared
                      let m = Double(sceneNow.mean)
                      let hi = Double(sceneNow.p90)
                      let nz = Double(sceneNow.noise)
                      if hi > 0.94 { autoExpo -= min(0.08, (hi - 0.94) * 1.1) }
                      // Spitzlichtschutz nach FLaeCHE, nicht nach p90: p90 bleibt bei
                      // weissen Fassaden niedrig, waehrend 2 % der Flaeche ausbrennen.
                      if hlNearWhiteShare > 0.008 {
                          autoExpo -= min(0.10, (hlNearWhiteShare - 0.008) * 6.0)
                      }
                      if m < 0.13 { autoExpo += min(0.08, (0.13 - m) * 0.9) }
                      // Lift nur in wirklich dunklen Szenen, sonst hellt er Lichter mit auf.
                      if m < 0.22 { autoLift = min(0.020, (0.22 - m) * 0.10) }
                      // Traegheit: hoechstens 1,5 % pro Bild. Ohne das pumpt die
                      // Belichtung bei harten Schnitten zwischen zwei Szenen.
                      let step: Double = 0.015
                      autoExpo = min(max(autoExpo, lastAutoExpo - step), lastAutoExpo + step)
                      lastAutoExpo = autoExpo
                      autoDetailScale = Float(1.0 - min(0.40, nz * 0.50))
                      // Hitzeschutz: meldet die Lastregel Stufe 2, Schaerfe zuruecknehmen,
                      // bevor Bilder ausfallen.
                      // Hitzeschutz erst bei .critical. Bei .serious stehen viele Geraete
                      // im Dauerbetrieb -- dort dauerhaft 15 % Schaerfe wegzunehmen sah
                      // aus wie "das Bild wird unscharf", ohne einen Bildausfall zu verhindern.
                      let th = ProcessInfo.processInfo.thermalState
                      if th == .critical { autoDetailScale *= 0.70 }
                  }
                  if autoExpo < 0.999 || autoExpo > 1.001 {
                      let f = CGFloat(pow(autoExpo, 1.0 / 2.2))
                      image = image.applyingFilter("CIColorMatrix", parameters: [
                          "inputRVector": CIVector(x: f, y: 0, z: 0, w: 0),
                          "inputGVector": CIVector(x: 0, y: f, z: 0, w: 0),
                          "inputBVector": CIVector(x: 0, y: 0, z: f, w: 0),
                          "inputAVector": CIVector(x: 0, y: 0, z: 0, w: 1),
                          "inputBiasVector": CIVector(x: 0, y: 0, z: 0, w: 0)
                      ])
                  }
                  if autoLift > 0.0005 {
                      let l = CGFloat(autoLift)
                      image = image.applyingFilter("CIColorMatrix", parameters: [
                          "inputRVector": CIVector(x: 1, y: 0, z: 0, w: 0),
                          "inputGVector": CIVector(x: 0, y: 1, z: 0, w: 0),
                          "inputBVector": CIVector(x: 0, y: 0, z: 1, w: 0),
                          "inputAVector": CIVector(x: 0, y: 0, z: 0, w: 1),
                          "inputBiasVector": CIVector(x: l, y: l, z: l, w: 0)
                      ])
                  }

                  // Range: PS5 liefert Limited (16-235). Wenn die Kette das nicht macht, wird
                  // das Bild zu dunkel und die Schatten laufen zu.
                  let rangeMode = UserDefaults.standard.integer(forKey: "pxSharpRange") // 0 auto, 1 expand, 2 compress
                  if rangeMode == 1 {
                      let s: CGFloat = 255.0 / 219.0
                      let b: CGFloat = -16.0 / 219.0
                      image = image.applyingFilter("CIColorMatrix", parameters: [
                          "inputRVector": CIVector(x: s, y: 0, z: 0, w: 0),
                          "inputGVector": CIVector(x: 0, y: s, z: 0, w: 0),
                          "inputBVector": CIVector(x: 0, y: 0, z: s, w: 0),
                          "inputAVector": CIVector(x: 0, y: 0, z: 0, w: 1),
                          "inputBiasVector": CIVector(x: b, y: b, z: b, w: 0)
                      ])
                  } else if rangeMode == 2 {
                      let s: CGFloat = 219.0 / 255.0
                      let b: CGFloat = 16.0 / 255.0
                      image = image.applyingFilter("CIColorMatrix", parameters: [
                          "inputRVector": CIVector(x: s, y: 0, z: 0, w: 0),
                          "inputGVector": CIVector(x: 0, y: s, z: 0, w: 0),
                          "inputBVector": CIVector(x: 0, y: 0, z: s, w: 0),
                          "inputAVector": CIVector(x: 0, y: 0, z: 0, w: 1),
                          "inputBiasVector": CIVector(x: b, y: b, z: b, w: 0)
                      ])
                  }

                  // Gamma: hebt oder senkt die Mitteltöne (dunkle Szenen durchzeichnen)
                  let colorEngine = (UserDefaults.standard.object(forKey: "pxSharpColorEngine") as? NSNumber)?.boolValue ?? true
                  // 1 = nur Luma schaerfen (keine Farbsaeume), 0 = pro Kanal (alt)
                  let lumaSharpen = (UserDefaults.standard.object(forKey: "pxSharpLumaSharpen") as? NSNumber)?.boolValue ?? true
                  let chromaSharpen = Float(UserDefaults.standard.object(forKey: "pxSharpChroma") as? Double ?? 0.0)
                  // Halo-Grenze: wie viel Ueberschwinger an Kanten erlaubt ist, in
                  // Anteilen des lokalen Kontrasts. 0,30 = keine sichtbaren Halos,
                  // 0,45 = mehr Textur, sichtbare Hoefe.
                  let haloLimit = Float(UserDefaults.standard.object(forKey: "pxSharpHalo") as? Double ?? 0.12)
                  let gamma = Float(UserDefaults.standard.object(forKey: "pxSharpGamma") as? Double ?? 1.0)
                  if !colorEngine && abs(gamma - 1.0) > 0.01 {
                      image = image.applyingFilter("CIGammaAdjust", parameters: ["inputPower": gamma])
                  }
                  // Schwarzwert: Offset auf alle Kanäle
                  let black = Float(UserDefaults.standard.object(forKey: "pxSharpBlack") as? Double ?? 0.0)
                  if !colorEngine && abs(black) > 0.001 {
                      image = image.applyingFilter("CIColorControls", parameters: [
                          kCIInputBrightnessKey: black
                      ])
                  }

                  // Tone Mapping: echter Verarbeitungsblock, nicht nur ein Reglerwert.
                  // Sony "XR Contrast Booster" und LG "Precision Dimming" arbeiten beide mit
                  // Highlight-Rolloff + Shadow-Lift, aber mit anderer Kurve und anderem Radius.
                  // ---- Automatik (Szenenanalyse) ------------------------------------
                  // Belichtung: linear in der Helligkeit gerechnet, in der Gamma-Domain
                  // angewendet (Faktor^(1/2.2)). Das ist physikalisch eine Belichtung,
                  // keine Gamma-Verschiebung.
                  let autoOn = (UserDefaults.standard.object(forKey: "pxSharpAuto") as? NSNumber)?.boolValue ?? false
                  // ---- TV-Helligkeit --------------------------------------------------
                  // Der eigentliche Grund fuer "zu hell": das iPad zeigt SDR mit bis zu
                  // ~600 cd/m2, ein Fernseher mit 100-200. Derselbe Code (z. B. 230/255)
                  // ist auf dem iPad also drei- bis sechsmal so hell. Ein TV regelt das
                  // ueber die Hintergrundbeleuchtung - hier wird die Ausgabe entsprechend
                  // skaliert, damit die absolute Leinhelle stimmt.
                  let tvBrightOn = (UserDefaults.standard.object(forKey: "pxSharpTvBrightness") as? NSNumber)?.boolValue ?? false
                  var tvComp = 1.0
                  if tvBrightOn {
                      let sb = min(max(Double(UIScreen.main.brightness), 0.0), 1.0)
                      // 100 % Bildschirm -> 0.55, 50 % -> 0.775, 20 % -> 0.91
                      tvComp = 0.55 + 0.45 * (1.0 - sb)
                  }
                  let autoStrength = Float(UserDefaults.standard.object(forKey: "pxSharpAutoStrength") as? Double ?? 0.65)
                  let scene = PXScene.shared
                  // Lastregel: 0 = alles an, 1 = Klarheit aus, 2 = zusaetzlich Deconvolution aus
                  let perfLevelNow = scene.perfLevel
                  // TV-Leuchtdichte und Szenen-Automatik in EINEM Durchgang (spart eine
                  // komplette Vollbild-Stufe).
                  var expo = tvComp
                  if lastClipShare > 0.006 && expo > 1.0 { expo = 1.0 }
                  if autoOn && autoStrength > 0.01 {
                      // Deckel bei +10 %: die Szenen-Automatik hat dunkle Szenen vorher um
                      // bis zu +23 % aufgehellt. Zusammen mit der Schatten-Anhebung wurde
                      // das Bild dadurch flau. Nachtszenen DUERFEN dunkel sein.
                      // Vorher: min(1.30, 1.0 + gain*strength*2.0) -- bei 75 % Staerke waren
                      // das bis zu +30 % Helligkeit. Genau das hat das Bild ueberzogen
                      // (gemessen: p90 205 -> 235, 4,9 % der Flaeche ueber 95 %).
                      expo *= min(1.06, max(0.90, 1.0 + (scene.gain - 1.0) * Double(autoStrength)))
                  }
                  // Wenn im Bild schon geclippt wird, darf die Automatik NICHT aufhellen.
                  // Gemessen: bei 75 % Staerke stieg das Clipping von 0,42 auf 4,67 %.
                  // Im HDR-Pfad keine SDR-Belichtung: PQ kodiert Helligkeit absolut.
                  if hdrActive { expo = 1.0 }
                  if abs(expo - 1.0) > 0.002 {
                      let f = CGFloat(pow(expo, 1.0 / 2.2))
                      image = image.applyingFilter("CIColorMatrix", parameters: [
                          "inputRVector": CIVector(x: f, y: 0, z: 0, w: 0),
                          "inputGVector": CIVector(x: 0, y: f, z: 0, w: 0),
                          "inputBVector": CIVector(x: 0, y: 0, z: f, w: 0),
                          "inputAVector": CIVector(x: 0, y: 0, z: 0, w: 1),
                          "inputBiasVector": CIVector(x: 0, y: 0, z: 0, w: 0)
                      ])
                  }

                  // Tone Mapping als echte S-Kurve (CIToneCurve): kontrollierter Kontrast in
                  // den Mitten, Rolloff in den Lichtern, leichte Anhebung der Schatten.
                  // CIHighlightShadowAdjust (vorher) war ein lokaler Operator und hat
                  // Helligkeitskanten um helle Objekte erzeugt — genau das wirkt künstlich.
                  let toneMap = (hdrActive || bypassNow) ? 0 : UserDefaults.standard.integer(forKey: "pxSharpToneMap")
                  if toneMap == 1 {
                      image = image.applyingFilter("CIToneCurve", parameters: [
                          "inputPoint0": CIVector(x: 0.00, y: 0.000),
                          "inputPoint1": CIVector(x: 0.25, y: 0.220),
                          "inputPoint2": CIVector(x: 0.50, y: 0.500),
                          "inputPoint3": CIVector(x: 0.75, y: 0.790),
                          "inputPoint4": CIVector(x: 1.00, y: 0.995)
                      ])
                  } else if toneMap == 2 {
                      image = image.applyingFilter("CIToneCurve", parameters: [
                          "inputPoint0": CIVector(x: 0.00, y: 0.003),
                          "inputPoint1": CIVector(x: 0.25, y: 0.230),
                          "inputPoint2": CIVector(x: 0.50, y: 0.520),
                          "inputPoint3": CIVector(x: 0.75, y: 0.808),
                          "inputPoint4": CIVector(x: 1.00, y: 0.985)
                      ])
                  }

                  // ---- Lokale Tonwertspreizung (TV-Technologie) ----------------------
                  // Wirkt nur auf die Verteilung, nicht auf die Gesamthelligkeit.
                  let localTone = Float(bypassNow ? 0 : (UserDefaults.standard.object(forKey: "pxSharpLocalTone") as? Double ?? 0.0))
                  if localTone > 0.01 && !hdrActive {
                      // In bereits hellen Szenen darf die Spreizung nicht weiter aufblasen.
                      // p90 ist der Spitzlichtpegel: ab 0,72 wird zurueckgenommen, ab 0,95 aus.
                      let headroom = Float(1.0 - min(max((scene.p90 - 0.72) / 0.23, 0.0), 1.0))
                      image = applyLocalTone(image, strength: localTone * 0.35 * headroom,
                                             ref: Float(min(max(scene.mean, 0.12), 0.65)))
                  }

                  // ---- Schattendurchzeichnung (Black Stabilizer) --------------------
                  // Manueller Regler + Automatik. Die Automatik greift umso staerker,
                  // je dunkler die Szene ist (Szenenmedian), und nie bei Tageslicht.
                  let shadowManual = Float(UserDefaults.standard.object(forKey: "pxSharpShadow") as? Double ?? 0.0)
                  // Black Stabilizer wirkt NUR in dunklen Szenen. In einer hellen Szene
                  // wuerde er nur den Kontrast flachdruecken (gemessen: std -3 %).
                  let darkFactor = min(max((0.34 - scene.mean) / 0.24, 0.0), 1.0)
                  var shadowAmt = Double(bypassNow ? 0 : shadowManual) * (0.15 + 0.85 * darkFactor)
                  if autoOn && autoStrength > 0.01 {
                      // Die Automatik darf die Schatten nur MODERAT anheben. Vorher kam sie
                      // in Nachtszenen auf 0,95 und hat das Schwarz auf 10/255 gehoben —
                      // das Bild wirkte flau und die Farben "ausgewaschen". Der Regler
                      // selbst bleibt voll nutzbar, die Automatik gibt hoechstens 0,22 dazu.
                      shadowAmt = min(0.85, shadowAmt + min(darkFactor * Double(autoStrength) * 0.85, 0.22))
                  }
                  if !hdrActive, shadowAmt > 0.02, let sk = shadowKernelInstance(),
                     let out = sk.apply(extent: image.extent,
                                        roiCallback: { _, rect in rect },
                                        arguments: [image, NSNumber(value: shadowAmt), NSNumber(value: 0.45),
                                                    NSNumber(value: shadowAmt * 0.035)]) {
                      image = out
                  }

                  var denoise = Float(UserDefaults.standard.object(forKey: "pxSharpDenoise") as? Double ?? 0.06)
                  if autoOn {
                      let darkBoost = 1.0 + Float(scene.darkFrac) * 0.45
                      denoise = min(1.0, denoise * (1.0 + Float(scene.noise) * autoStrength * 1.2) * darkBoost)
                  }
                  let deblock = Float(UserDefaults.standard.object(forKey: "pxSharpDeblock") as? Double ?? 0.14)
                  let dbnBase = Float(UserDefaults.standard.object(forKey: "pxSharpDeband") as? Double ?? 0.30)
                  let dbn = min(1.6, dbnBase * (1.0 + Float(scene.darkFrac) * 1.4))

                  // ---- Bitraten-Adaption -------------------------------------------
                  // Bei 8 Mbit ist ein 1080p60-Bild stark komprimiert (Blockkanten,
                  // ausgewaschene Textur), bei 22 Mbit kaum. Ein Fernseher regelt seine
                  // MPEG-Rauschunterdrueckung genauso: mehr Filter, weniger Schaerfe,
                  // wenn die Leitung schwach ist. Sonst verstaerkt die Schaerfe Bloecke.
                  let mbps = scene.streamMbps
                  var bitrateFactor: Float = 1.0
                  if mbps > 0.1 {
                      bitrateFactor = Float(min(max((mbps - 7.0) / 15.0, 0.0), 1.0))
                  }
                  let filterBoost = 1.0 + (1.0 - bitrateFactor) * 0.35   // bis +35 % Filter
                  denoise = min(1.0, denoise * filterBoost)

                  let aD = denoise > 0.02 ? min(min(denoise, 1.0) * 2.0, 1.0) : 0.0
                  let aB = deblock > 0.02 ? min(max(deblock, 0), 1) * 0.90 * filterBoost : 0.0
                  // Deband laeuft IMMER. Der Sparmodus hatte sie abgeschaltet — dadurch
                  // kamen die Treppenstufen in dunklen Verlaeufen zurueck (im 100-%-Bild
                  // als diagonale Streifen sichtbar). Sie kostet im zusammengefassten
                  // Kernel nur einen Ring, nicht einen eigenen Durchgang.
                  let aG = dbn > 0.02 ? min(dbn, 1.6) * 0.65 * filterBoost : 0.0

                  if (aD + aB + aG) > 0.02, let k = cleanKernelInstance(),
                     let out = k.apply(extent: image.extent,
                                       roiCallback: { _, rect in rect.insetBy(dx: -9, dy: -9) },
                                       arguments: [image,
                                                   NSNumber(value: 2.4), NSNumber(value: 0.055), NSNumber(value: aD),
                                                   NSNumber(value: 1.7), NSNumber(value: 0.042), NSNumber(value: aB),
                                                   NSNumber(value: 3.0), NSNumber(value: 0.012), NSNumber(value: aG)]) {
                      image = out
                  } else {
                      // Rueckfall, falls der Kernel nicht kompiliert: die drei Einzelstufen.
                      if aD > 0.02, let k = deblockKernelInstance(),
                         let out = k.apply(extent: image.extent,
                                           roiCallback: { _, rect in rect.insetBy(dx: -6, dy: -6) },
                                           arguments: [image, NSNumber(value: 2.4), NSNumber(value: 0.075), NSNumber(value: aD)]) {
                          image = out
                      }
                      if aB > 0.02, let k = deblockKernelInstance(),
                         let out = k.apply(extent: image.extent,
                                           roiCallback: { _, rect in rect.insetBy(dx: -6, dy: -6) },
                                           arguments: [image, NSNumber(value: 1.7), NSNumber(value: 0.042), NSNumber(value: aB)]) {
                          image = out
                      }
                      if aG > 0.02, let k = deblockKernelInstance(),
                         let out = k.apply(extent: image.extent,
                                           roiCallback: { _, rect in rect.insetBy(dx: -8, dy: -8) },
                                           arguments: [image, NSNumber(value: 3.0), NSNumber(value: 0.012), NSNumber(value: aG)]) {
                          image = out
                      }
                  }

                  // ---- Anisotrope Diffusion (NVIDIA-Denoiser-Prinzip) ---------------
                  let diffAmt = Float(min(max((UserDefaults.standard.object(forKey: "pxSharpDenoise") as? Double ?? 0.0) * 2.0, 0.0), 1.0))
                  if !bypassNow, diffAmt > 0.05, (UserDefaults.standard.object(forKey: "pxSharpDiffuse") as? Bool ?? true),
                     let dk = diffuseKernelInstance() {
                      let iters = Int(round(diffAmt * 8.0))
                      for _ in 0..<max(0, iters) {
                          if let out = dk.apply(extent: image.extent,
                                                roiCallback: { _, rect in rect.insetBy(dx: -2, dy: -2) },
                                                arguments: [image, NSNumber(value: 0.20), NSNumber(value: 0.05)]) {
                              image = out
                          }
                      }
                  }

                  // ---- Helligkeits-Entrauschung (eigener Durchgang) ------------------
                  let lumaDN = Float(min(max((UserDefaults.standard.object(forKey: "pxSharpDenoise") as? Double ?? 0.0) * 2.0, 0.0), 1.0))
                  if !bypassNow, lumaDN > 0.05, let lk = lumaDNKernelInstance(),
                     let out = lk.apply(extent: image.extent,
                                        roiCallback: { _, rect in rect.insetBy(dx: -4, dy: -4) },
                                        arguments: [image, NSNumber(value: lumaDN),
                                                    NSNumber(value: 0.055), NSNumber(value: 2.4)]) {
                      image = out
                  }

                  // ---- Farb-Entrauschung (eigener Durchgang) -------------------------
                  // Nur die Farbe wird geglaettet, die Helligkeit bleibt unberuehrt.
                  let chromaDN = Float(min(max((UserDefaults.standard.object(forKey: "pxSharpDenoise") as? Double ?? 0.0) * 1.6, 0.0), 1.0))
                  if !bypassNow, chromaDN > 0.05, let dnk = chromaDNKernelInstance(),
                     let out = dnk.apply(extent: image.extent,
                                         roiCallback: { _, rect in rect.insetBy(dx: -5, dy: -5) },
                                         arguments: [image, NSNumber(value: chromaDN),
                                                     NSNumber(value: 0.05), NSNumber(value: 2.0)]) {
                      image = out
                  }

                  // ---- Chroma-Rekonstruktion -----------------------------------------
                  let chromaAmt = Float((UserDefaults.standard.object(forKey: "pxSharpChroma") as? Double ?? 0.0)
                                        * min(max((UserDefaults.standard.object(forKey: "pxSharpMaster") as? Double) ?? 1.0, 0.0), 1.0))
                  if !bypassNow, chromaAmt > 0.01, let ck = chromaKernelInstance(),
                     let out = ck.apply(extent: image.extent,
                                        roiCallback: { _, rect in rect.insetBy(dx: -4, dy: -4) },
                                        arguments: [image, NSNumber(value: 1.8),
                                                    NSNumber(value: chromaAmt * 1.8), NSNumber(value: 0.010)]) {
                      image = out
                  }

                  // Clear Image: Kantenvorverstärkung bei Quellauflösung, damit der Upscaler
                  // echte Kanten statt weicher Pixel bekommt — ebenfalls CAS, damit die
                  // Vorverstärkung keine Halos in die Skalierung schickt.
                  let clearImage = Float(bypassNow ? 0 : ((UserDefaults.standard.object(forKey: "pxSharpClearImage") as? Double ?? 0.0) * min(max((UserDefaults.standard.object(forKey: "pxSharpMaster") as? Double) ?? 1.0, 0.0), 1.0)))
                  if clearImage > 0.05 {
                      if let k = casKernelInstance(),
                         let out = k.apply(extent: image.extent,
                                           roiCallback: { _, rect in rect.insetBy(dx: -4, dy: -4) },
                                           arguments: [image, NSNumber(value: 0.85), NSNumber(value: 1.7), NSNumber(value: 3.0),
                                                       NSNumber(value: min(clearImage, 1.0) * 0.95),
                                                       NSNumber(value: min(clearImage, 1.0) * 0.55),
                                                       NSNumber(value: min(clearImage, 1.0) * 0.45),
                                                       NSNumber(value: haloLimit * 0.85), NSNumber(value: lumaSharpen),
                                                       NSNumber(value: chromaSharpen),
                                                       NSNumber(value: (UserDefaults.standard.object(forKey: "pxSharpCoring") as? Double ?? 0.04) * 0.020)]) {
                          image = out
                      } else {
                          image = image.applyingFilter("CIUnsharpMask", parameters: [
                              kCIInputRadiusKey: 1.2,
                              kCIInputIntensityKey: min(clearImage, 1.0) * 0.55
                          ])
                      }
                  }

                  // Kanten-Rekonstruktion (Deconvolution) bei 1080p, vor der Skalierung.
                  let deconvAmt = Float(bypassNow ? 0 : ((UserDefaults.standard.object(forKey: "pxSharpDeconv") as? Double ?? 0.0) * min(max((UserDefaults.standard.object(forKey: "pxSharpMaster") as? Double) ?? 1.0, 0.0), 1.0)))
                  // Deconvolution läuft IMMER — sie ist die Stufe mit dem größten
                  // Texturgewinn (+44 % gemessen). Sie wird von keiner Lastregel
                  // abgeschaltet, auch nicht bei Hitze.
                  if deconvAmt > 0.02, let k = deconvKernelInstance(),
                     let out = k.apply(extent: image.extent,
                                       roiCallback: { _, rect in rect.insetBy(dx: -3, dy: -3) },
                                       arguments: [image,
                                                   NSNumber(value: min(deconvAmt, 1.0) * 0.45),
                                                   NSNumber(value: 0.004 + Double(min(Float(scene.noise), 1.0)) * 0.012),
                                                   NSNumber(value: Float(UserDefaults.standard.object(forKey: "pxSharpHalo") as? Double ?? 0.12))]) {
                      image = out
                  }

                  // Klarheit (lokaler Kontrast) bei Quellauflösung: eine 8-px-Wirkung auf
                  // dem Panel ist bei 1080p eine 12-px-Wirkung — sichtbar identisch, aber
                  // ein Drittel der Pixel.
                  let clarityAmt = Float(bypassNow ? 0 : ((UserDefaults.standard.object(forKey: "pxSharpClarity") as? Double ?? 0.0) * min(max((UserDefaults.standard.object(forKey: "pxSharpMaster") as? Double) ?? 1.0, 0.0), 1.0) * Double(thermalScale())))
                  if clarityAmt > 0.02, let lc = diffKernelInstance() {
                      let small = image.transformed(by: CGAffineTransform(scaleX: 0.125, y: 0.125))
                      let blurred = small.applyingFilter("CIGaussianBlur", parameters: [
                          kCIInputRadiusKey: 3.2
                      ]).cropped(to: small.extent)
                      let up = blurred.transformed(by: CGAffineTransform(scaleX: 8, y: 8))
                      // Die Begrenzung waechst mit dem Regler: bei 0,28 sind es 0,062,
                      // bei 1,0 sind es 0,105. Gemessen erzeugt das bis 0,105 noch
                      // KEINE Halos (0,0 % Ueberschuss), also ist der Spielraum da.
                      let clarLimit = 0.055 + Double(min(clarityAmt, 1.0)) * 0.075
                      if let out = lc.apply(extent: image.extent, arguments: [
                          image, up, NSNumber(value: min(clarityAmt, 1.0) * 1.50), NSNumber(value: clarLimit)
                      ]) {
                          image = out
                      }
                  }

                  // Mini-LED-Dimming und Farb-LUT wirken bei QUELLAUFLÖSUNG (1080p) statt
                  // auf dem Panel. Beides sind niederfrequente bzw. punktweise Operationen —
                  // das Ergebnis ist identisch, kostet aber nur 2,1 statt 5,6 Mio Pixel.
                  let localDim = Float(bypassNow ? 0 : (UserDefaults.standard.object(forKey: "pxSharpLocalDim") as? Double ?? 0.0))
                  if localDim > 0.02 && !hdrActive {
                      let dimScale = 0.60 + 0.40 * Float(min(max(scene.mean / 0.40, 0.0), 1.0))
                      // Bei Stufe 2 nur noch halbes Dimming: es ist die teuerste Stufe
                      // nach der Deconvolution, und der Unterschied ist im Bild klein.
                      let pd: Float = perfLevelNow >= 2 ? 0.5 : 1.0
                      image = applyLocalDimming(image, strength: min(localDim, 1.0) * dimScale * pd, zone: 36)
                  }
                  if pendingWhitePoint {
                      pendingWhitePoint = false
                      if !hdrActive { measureWhitePoint(from: image) }
                      else { pxNote("HDR aktiv — Weisspunktabgleich nur fuer SDR") }
                  }
                  if colorEngine && !hdrActive && !bypassNow {
                      image = applyColorEngine(image)
                  }
                  // Messung NACH der Farb-LUT: sonst sieht der Spitzlichtschutz die
                  // Aufhellung durch LUT und Bereichsspreizung nicht -- und genau die
                  // hat das Bild ueberzogen.
                  let hlBalance = (UserDefaults.standard.object(forKey: "pxSharpHlBalance") as? NSNumber)?.boolValue ?? true
                  if hlBalance {
                      hlCounter += 1
                      if hlCounter >= 30 {
                          hlCounter = 0
                          if !hdrActive { measureHighlightBalance(from: image) }
                      }
                  } else {
                      // Ohne Messung darf ein alter Clip-Wert die Automatik nicht
                      // dauerhaft blockieren.
                      lastClipShare *= 0.90
                  }

                  let profiling = UserDefaults.standard.bool(forKey: "pxSharpProfile")
                  if profiling { profPrefixes = [("1080p", image)] }
                  let sx = target.width / src.width
                  let sy = target.height / src.height
                  let pixelPerfect = UserDefaults.standard.object(forKey: "pxSharpPixelPerfect") as? Bool ?? false
                  // MetalFX-Spatial-Scaler (kantenbewusstes Hochskalieren). Ueber den
                  // Schalter, Standard aus. Der Ausgang wird fuer die Messung in PXProbe
                  // gespiegelt — nur so laesst sich per /shot pruefen, ob der Pfad
                  // korrekt rechnet.
                  let useMFX = (UserDefaults.standard.object(forKey: "pxSharpMetalFX") as? NSNumber)?.boolValue ?? false

                  // ---- Frueh schaerfen (Option) -------------------------------------
                  // Statt nach dem Hochskalieren bei 2732 (4,2 Mio. Pixel) wird schon bei
                  // 1920 geschaerft (2,1 Mio.) -- halbe Rechenzeit. Der Schalter misst,
                  // ob das im Bild sichtbar wird; die spaetere Stufe faellt dann aus.
                  let earlyDetail = UserDefaults.standard.bool(forKey: "pxSharpDetailEarly")
                  if earlyDetail && !useMFX {
                      image = applyDetailStage(image)
                  }

                  if useMFX {
                      // Skalierung übernimmt MetalFX am Ende.
                  } else if pixelPerfect {
                      // 1:1: keine Skalierung, jeder Stream-Pixel sitzt auf genau einem Panel-Pixel.
                      image = image.transformed(by: CGAffineTransform(scaleX: 1, y: 1))
                  } else {
                  switch currentMode {
                  case .fit:
                      let s = min(sx, sy)
                      let useKernelUp = false   // siehe Kommentar unten: wird vom Panel-Kernel abgedeckt
                      if useKernelUp, let uk = upscaleKernelInstance() {
                          let outExt = CGRect(x: 0, y: 0,
                                              width: (src.width * s).rounded(.down),
                                              height: (src.height * s).rounded(.down))
                          let upStrength = Float(UserDefaults.standard.object(forKey: "pxSharpUpScale") as? Double ?? 0.60)
                          let inv = 1.0 / s
                          if let out = uk.apply(extent: outExt,
                                                // WICHTIG: der ROI-Rueckruf bekommt Ziel-Koordinaten und
                                                // muss in QUELL-Koordinaten zurueckgeben (Faktor invScale).
                                                roiCallback: { _, rect in
                                                    rect.applying(CGAffineTransform(scaleX: inv, y: inv)).insetBy(dx: -2, dy: -2)
                                                },
                                                arguments: [image, NSNumber(value: inv),
                                                            NSNumber(value: upStrength), NSNumber(value: 0.55)]) {
                              image = out
                          } else {
                              image = image.applyingFilter("CILanczosScaleTransform", parameters: [
                                  kCIInputScaleKey: s,
                                  kCIInputAspectRatioKey: 1.0
                              ])
                          }
                      } else {
                          image = image.applyingFilter("CILanczosScaleTransform", parameters: [
                              kCIInputScaleKey: s,
                              kCIInputAspectRatioKey: 1.0
                          ])
                      }
                  case .zoom:
                      let s = max(sx, sy)
                      image = image.applyingFilter("CILanczosScaleTransform", parameters: [
                          kCIInputScaleKey: s,
                          kCIInputAspectRatioKey: 1.0
                      ])
                  case .stretch:
                      image = image.applyingFilter("CIBicubicScaleTransform", parameters: [
                          kCIInputScaleKey: sy,
                          kCIInputAspectRatioKey: sx / sy
                      ])
                  }
                  }

                  let placed = image.extent
                  let dx = (target.width - placed.width) / 2 - placed.origin.x
                  let dy = (target.height - placed.height) / 2 - placed.origin.y
                  image = image.transformed(by: CGAffineTransform(translationX: dx, y: dy))
                  if UserDefaults.standard.bool(forKey: "pxSharpProfile") { profPrefixes.append(("skaliert", image)) }


                  // Kantengerichtete Schärfung (Option): 1:1 nach der Skalierung.
                  if (UserDefaults.standard.object(forKey: "pxSharpScaler") as? Int ?? 0) == 1,
                     let dk = dirKernelInstance() {
                      let amt = Float(UserDefaults.standard.object(forKey: "pxSharpEasu") as? Double ?? 1.0)
                      let haloK = Float(UserDefaults.standard.object(forKey: "pxSharpHalo") as? Double ?? 0.12)
                      if let out = dk.apply(extent: image.extent,
                                            roiCallback: { _, rect in rect.insetBy(dx: -4, dy: -4) },
                                            arguments: [image, NSNumber(value: amt * 0.55),
                                                        NSNumber(value: 1.6), NSNumber(value: haloK)]) {
                          image = out
                      }
                  }

                  // Schaerfung auf PANEL-Aufloesung: beim Hineinzoomen bleiben die
                  // Kanten crisper als bei Quellaufloesung.
                  // Schalter "Frueh schaerfen": laeuft stattdessen bei 1080p VOR dem
                  // Hochskalieren -- halbe Pixelzahl (2,1 statt 4,2 Mio.), also rund
                  // halbe Rechenzeit. Wird gemessen, nicht behauptet.
                  let detailEarly = UserDefaults.standard.bool(forKey: "pxSharpDetailEarly")
                  if !useMFX && !detailEarly {
                      image = applyDetailStage(image)
                  }

                  // ---- Chroma-Nachschaerfung auf PANEL-Aufloesung --------------------
                  // Die Farbe kommt im Stream nur mit halber Aufloesung (4:2:0) und wird
                  // beim Hochskalieren ein zweites Mal weich. Gemessen bei 2732 px:
                  // Helligkeit 1,0 px, Farbe 5,0 px. Das Limit fuer 4:2:0 liegt bei
                  // 2,85 px -- hier wird die Farbe auf ~3,0 px zurueckgeholt.
                  let chromaPost = Float((UserDefaults.standard.object(forKey: "pxSharpChroma") as? Double ?? 0.0)
                                         * min(max((UserDefaults.standard.object(forKey: "pxSharpMaster") as? Double) ?? 1.0, 0.0), 1.0))
                  if !bypassNow, chromaPost > 0.01, let ck = chromaKernelInstance(),
                     let out = ck.apply(extent: image.extent,
                                        roiCallback: { _, rect in rect.insetBy(dx: -5, dy: -5) },
                                        arguments: [image, NSNumber(value: 2.2),
                                                    NSNumber(value: chromaPost * 1.1), NSNumber(value: 0.006)]) {
                      image = out
                  }

                  // Kontrast: 50 % = neutral
                  let contrastRaw = Float(UserDefaults.standard.object(forKey: "pxSharpContrast") as? Double ?? 0.5)
                  if !colorEngine && abs(contrastRaw - 0.5) > 0.01 {
                      image = image.applyingFilter("CIColorControls", parameters: [
                          kCIInputContrastKey: 0.8 + min(max(contrastRaw, 0), 1) * 0.4
                      ])
                  }

                  // Farbtemperatur als NORMALISIERTE Matrix. CITemperatureAndTint hat die
                  // Kanäle ungefiltert verstärkt: bei 5500 K und 9500 K waren je über 8 %
                  // aller Pixel geclippt. Hier wird gegen die Luma-Gewichtung geteilt,
                  // dadurch bleibt die Helligkeit gleich und es entsteht kein Clipping.
                  let tempRaw = Float(UserDefaults.standard.object(forKey: "pxSharpTemp") as? Double ?? 0.5)
                  if !colorEngine && abs(tempRaw - 0.5) > 0.005 {
                      let t = Double(tempRaw - 0.5) * 2.0          // -1 = warm, +1 = kühl
                      let kR = 1.0 - 0.22 * t
                      let kG = 1.0
                      let kB = 1.0 + 0.22 * t
                      let kn = 0.2126 * kR + 0.7152 * kG + 0.0722 * kB
                      image = image.applyingFilter("CIColorMatrix", parameters: [
                          "inputRVector": CIVector(x: CGFloat(kR / kn), y: 0, z: 0, w: 0),
                          "inputGVector": CIVector(x: 0, y: CGFloat(kG / kn), z: 0, w: 0),
                          "inputBVector": CIVector(x: 0, y: 0, z: CGFloat(kB / kn), w: 0),
                          "inputAVector": CIVector(x: 0, y: 0, z: 0, w: 1),
                          "inputBiasVector": CIVector(x: 0, y: 0, z: 0, w: 0)
                      ])
                  }

                  // Weißabgleich RGB (Feinschliff): 1.00 = neutral. Damit lässt sich der letzte
                  // Farbstich rausnehmen, den ein einzelner Kelvin-Regler nicht trifft.
                  let wbR = Float(UserDefaults.standard.object(forKey: "pxSharpWB_R") as? Double ?? 1.0)
                  let wbG = Float(UserDefaults.standard.object(forKey: "pxSharpWB_G") as? Double ?? 1.0)
                  let wbB = Float(UserDefaults.standard.object(forKey: "pxSharpWB_B") as? Double ?? 1.0)
                  if !colorEngine && (abs(wbR - 1.0) > 0.002 || abs(wbG - 1.0) > 0.002 || abs(wbB - 1.0) > 0.002) {
                      image = image.applyingFilter("CIColorMatrix", parameters: [
                          "inputRVector": CIVector(x: CGFloat(wbR), y: 0, z: 0, w: 0),
                          "inputGVector": CIVector(x: 0, y: CGFloat(wbG), z: 0, w: 0),
                          "inputBVector": CIVector(x: 0, y: 0, z: CGFloat(wbB), w: 0),
                          "inputAVector": CIVector(x: 0, y: 0, z: 0, w: 1),
                          "inputBiasVector": CIVector(x: 0, y: 0, z: 0, w: 0)
                      ])
                  }

                  let satRaw = Float(UserDefaults.standard.object(forKey: "pxSharpSaturation") as? Double ?? 0.5)
                  let sat = 0.7 + min(max(satRaw, 0), 1) * 0.6
                  if !colorEngine && abs(sat - 1.0) > 0.01 {
                      image = image.applyingFilter("CIColorControls", parameters: [
                          kCIInputSaturationKey: sat
                      ])
                  }

                  let vib = Float(UserDefaults.standard.object(forKey: "pxSharpVibrance") as? Double ?? 0.0)
                  if !colorEngine && vib > 0.01 {
                      image = image.applyingFilter("CIVibrance", parameters: [
                          "inputAmount": min(vib, 1.0)
                      ])
                  }

                  if !colorEngine {
                      image = applyCalibration(image)
                  }

                  // Dithering zuletzt (nur SDR/8 Bit; HDR laeuft mit 16 Bit)
                  if !hdrActive, let dk = ditherKernelInstance(),
                     let out = dk.apply(extent: image.extent,
                                        roiCallback: { _, rect in rect },
                                        arguments: [image, NSNumber(value: 0.0024)]) {
                      image = out
                  }

                  let outSpace: CGColorSpace
                  if hdrActive, let pq = CGColorSpace(name: CGColorSpace.itur_2100_PQ) {
                      outSpace = pq
                  } else {
                      outSpace = CGColorSpace(name: CGColorSpace.sRGB) ?? CGColorSpaceCreateDeviceRGB()
                  }

                  let renderStartMFX = CACurrentMediaTime()
                  if useMFX, let device = metalView?.device {
                      let fit = min(target.width / src.width, target.height / src.height)
                      let outW = max(2, Int((src.width * fit).rounded(.down)))
                      let outH = max(2, Int((src.height * fit).rounded(.down)))
                      let ox = (Int(target.width) - outW) / 2
                      let oy = (Int(target.height) - outH) / 2

                      if ensureMetalFX(device: device,
                                       input: src,
                                       output: CGSize(width: outW, height: outH)),
                         let inTex = mfxIn, let outTex = mfxOut, let scaler = mfxScaler {

                          // Drawable leeren, damit die Balken schwarz sind
                          let rp = MTLRenderPassDescriptor()
                          rp.colorAttachments[0].texture = drawable.texture
                          rp.colorAttachments[0].loadAction = .clear
                          rp.colorAttachments[0].storeAction = .store
                          rp.colorAttachments[0].clearColor = MTLClearColor(red: 0, green: 0, blue: 0, alpha: 1)
                          cb.makeRenderCommandEncoder(descriptor: rp)?.endEncoding()

                          // WICHTIG: bounds müssen den tatsächlichen Bildbereich abdecken.
                          // Das Bild wurde vorher auf die Drawable-Mitte verschoben (extent
                          // beginnt z.B. bei x=406,y=255). Mit bounds=(0,0,1920,1080) wurde
                          // nur eine Ecke gerendert; der Rest der Textur blieb undefinierter
                          // Speicher — genau das war das lila Bild bei MetalFX.
                          var norm = image.transformed(by: CGAffineTransform(
                              translationX: -image.extent.origin.x,
                              y: -image.extent.origin.y))
                          // Metal-Texturen und Core Image zaehlen die Y-Achse
                          // unterschiedlich. Ergebnis: das Bild stand kopf.
                          // Die Lage ist deshalb einstellbar (0=aus, 1=Y, 2=X, 3=beide).
                          let flip = (UserDefaults.standard.object(forKey: "pxSharpMfxFlip") as? Int) ?? 0
                          if flip == 1 || flip == 3 {
                              norm = norm.transformed(by: CGAffineTransform(translationX: 0, y: norm.extent.height)
                                  .scaledBy(x: 1, y: -1))
                          }
                          if flip == 2 || flip == 3 {
                              norm = norm.transformed(by: CGAffineTransform(translationX: norm.extent.width, y: 0)
                                  .scaledBy(x: -1, y: 1))
                          }
                          // Schulter auch im MetalFX-Pfad: dieser Zweig verlaesst draw()
                          // vorher, deshalb fehlte sie hier (gemessen: 0,65 % ueber 0,99
                          // mit MetalFX, 0,00 % ohne).
                          if !bypassNow, (UserDefaults.standard.object(forKey: "pxSharpShoulder") as? Bool ?? true),
                             let sk = shoulderKernelInstance(),
                             let sho = sk.apply(extent: norm.extent,
                                                roiCallback: { _, rect in rect },
                                                arguments: [norm, NSNumber(value: 0.88)]) {
                              norm = sho
                          }

                          ciContext?.render(norm, to: inTex, commandBuffer: cb,
                                            bounds: CGRect(x: 0, y: 0,
                                                           width: CGFloat(Int(src.width)),
                                                           height: CGFloat(Int(src.height))),
                                            colorSpace: outSpace)

                          scaler.colorTexture = inTex
                          scaler.outputTexture = outTex
                          scaler.inputContentWidth = Int(src.width)
                          scaler.inputContentHeight = Int(src.height)
                          scaler.encode(commandBuffer: cb)

                          if let blit = cb.makeBlitCommandEncoder() {
                              blit.copy(from: outTex, sourceSlice: 0, sourceLevel: 0,
                                        sourceOrigin: MTLOrigin(x: 0, y: 0, z: 0),
                                        sourceSize: MTLSize(width: outW, height: outH, depth: 1),
                                        to: drawable.texture, destinationSlice: 0, destinationLevel: 0,
                                        destinationOrigin: MTLOrigin(x: ox, y: oy, z: 0))
                              blit.endEncoding()
                          }

                          if mfxStateFlag != true {
                              mfxStateFlag = true
                              UserDefaults.standard.set("1", forKey: "pxSharpMfxActive")
                          }
                          cb.present(drawable)
                          cb.addCompletedHandler { [weak self] _ in
                              PXScene.shared.noteRenderMs((CACurrentMediaTime() - renderStartMFX) * 1000.0)
                              // Probe asynchron im Completed-Handler: kein waitUntilCompleted()
                              // mehr, damit die CPU nicht nach jedem Frame auf die GPU wartet.
                              // /shot bekommt das Bild, sobald die GPU fertig ist.
                              guard (UserDefaults.standard.object(forKey: "pxSharpProbeLive") as? NSNumber)?.boolValue ?? false,
                                    let c = self?.ciContext,
                                    var outCI = CIImage(mtlTexture: outTex, options: [.colorSpace: outSpace]) else { return }
                              let r = CGRect(x: 0, y: 0, width: CGFloat(outW), height: CGFloat(outH))
                              let fl = (UserDefaults.standard.object(forKey: "pxSharpMfxFlip") as? Int) ?? 0
                              if fl == 1 || fl == 3 {
                                  outCI = outCI.transformed(by: CGAffineTransform(translationX: 0, y: outCI.extent.height)
                                      .scaledBy(x: 1, y: -1))
                              }
                              if fl == 2 || fl == 3 {
                                  outCI = outCI.transformed(by: CGAffineTransform(translationX: outCI.extent.width, y: 0)
                                      .scaledBy(x: -1, y: 1))
                              }
                              PXProbe.shared.set(outCI.cropped(to: r), context: c, space: outSpace,
                                                 width: outW, height: outH)
                          }
                          cb.commit()
                          noteFrameRendered()
                          runMemGuard()
                          return
                      }
                  }

                  // ---- Randsaum entfernen -------------------------------------------
                  // Die Kernel-Kette (CAS, Deconvolution, Clean, Dither) tastet am Rand
                  // Nachbarpixel ab. Ausserhalb des Bildes liefert Core Image
                  // transparentes Schwarz; dadurch rechnet der Kernel dort einen extremen
                  // Kontrast und schreibt einen 1-3 px breiten hellen Saum an alle vier
                  // Kanten (gemessen: Rand 61 statt 31 innen, also 2x). Auf dem Panel
                  // sieht das wie ein leuchtender Rahmen um das Bild aus.
                  // 4 px beschneiden entfernt den Saum vollstaendig; bei 2732 px Breite
                  // sind das 0,15 % — unsichtbar.
                  let saum = image.extent.insetBy(dx: 4, dy: 4)
                  if saum.width > 16, saum.height > 16 {
                      image = image.cropped(to: saum)
                  }

                  // ---- Weiche Spitzlicht-Schulter (letzter Schritt) -------------------
                  if !bypassNow, (UserDefaults.standard.object(forKey: "pxSharpShoulder") as? Bool ?? true),
                     let sk = shoulderKernelInstance(),
                     let out = sk.apply(extent: image.extent,
                                        roiCallback: { _, rect in rect },
                                        arguments: [image, NSNumber(value: 0.88)]) {
                      image = out
                  }

                  let canvasRect = CGRect(origin: .zero, size: target)
                  let canvas = CIImage(color: CIColor.black).cropped(to: canvasRect)
                  let composited = image.composited(over: canvas)
                  if UserDefaults.standard.bool(forKey: "pxSharpProfile") {
                      profPrefixes.append(("fertig", composited))
                      measureProfile(space: outSpace)
                  }

                  if mfxStateFlag != false {
                      mfxStateFlag = false
                      UserDefaults.standard.set("0", forKey: "pxSharpMfxActive")
                  }
                  let ctx = hdrActive ? (hdrContext ?? ciContext) : ciContext
                  if let c = ctx, ((UserDefaults.standard.object(forKey: "pxSharpProbeLive") as? NSNumber)?.boolValue ?? false) {
                      PXProbe.shared.set(composited, context: c, space: outSpace,
                                         width: Int(target.width), height: Int(target.height))
                  }
                  ctx?.render(composited,
                              to: drawable.texture,
                              commandBuffer: cb,
                              bounds: canvasRect,
                              colorSpace: outSpace)

                  let renderStart = CACurrentMediaTime()
                  cb.addCompletedHandler { _ in
                      PXScene.shared.noteRenderMs((CACurrentMediaTime() - renderStart) * 1000.0)
                  }
                  cb.present(drawable)
                  cb.commit()

                  // Renderrate messen: /state liefert pxSharpFPS.
                  noteFrameRendered()

                  // Speicher-Bremse (laeuft jetzt in beiden Pfaden: MetalFX und Core Image)
                  runMemGuard()
              }

              /// Core Image und Metal halten Puffer, die iOS erst unter Druck freigibt.
              /// Gemessen wuchs der Speicher 300-500 MB/min bis zum Absturz. Diese Bremse
              /// lief bisher nur im Nicht-MetalFX-Pfad -- mit MetalFX an stieg der
              /// Speicher ungebremst. Jetzt laeuft sie nach jedem Frame in beiden Pfaden.
              private func runMemGuard() {
                  memGuardFrame += 1
                  let guardEvery = max(1, UserDefaults.standard.integer(forKey: "pxSharpMemBrakeEvery") == 0
                                       ? 30 : UserDefaults.standard.integer(forKey: "pxSharpMemBrakeEvery"))
                  let guardAbove = UserDefaults.standard.object(forKey: "pxSharpMemBrakeMB") as? Int ?? 900
                  guard memGuardFrame >= guardEvery else { return }
                  memGuardFrame = 0
                  let mb = Self.pxFootprintMB()
                  guard mb > Double(guardAbove) else { return }
                  ciContext?.clearCaches()
                  hdrContext?.clearCaches()
                  memGuardRuns += 1
                  UserDefaults.standard.set(Int(mb), forKey: "pxMemGuardLast")
                  // Ab 1,2 GB reicht clearCaches() nicht: den Kontext neu bauen.
                  // Das gibt die internen Pools frei, ohne die Verbindung zu
                  // unterbrechen (kostet ein Bild).
                  if mb > 900, CACurrentMediaTime() - lastContextReset > 15.0 {
                      rebuildCIContext()
                      UserDefaults.standard.set(Int(Self.pxFootprintMB()), forKey: "pxMemAfterReset")
                  }
              }
          }

          // MARK: - PXScene: Szenenanalyse (das "Auge" des Fernsehers)

          /// Ein Fernseher regelt nicht mit festen Werten, sondern analysiert jedes Bild:
          /// wie hell ist die Szene, wie viel Spitzlicht gibt es, wie stark rauscht sie.
          /// Genau das macht diese Klasse. Sie liest eine Stichprobe der Y-Ebene des
          /// Quellbildes (kein GPU-Readback, kostet < 1 ms) und leitet daraus drei
          /// Werte ab, die der Renderer pro Frame benutzt:
          ///
          ///   gain   Belichtungskorrektur (dunkle Szene heller, helle Szene dunkler)
          ///   noise  Rauschmass (0 = sauber, 1 = verrauscht) -> mehr Filter, weniger Schärfe
          ///   p90    Spitzlichtpegel -> fuer den Highlight-Rolloff
          ///
          /// Das entspricht "AI Brightness Control" + "Dynamic Tone Mapping" eines TVs.
          final class PXScene {
              static let shared = PXScene()

              private let lock = NSLock()
              private var lastAnalysis: CFTimeInterval = 0

              // Glaettung (langsam, damit es nicht pumpt)
              private var gainEma: Double = 1.0
              private var noiseEma: Double = 0.0
              private var renderMsEma: Double = 0
              private var perfLevelStore: Int = 0
              private var perfCooldown: CFTimeInterval = 0

              var perfLevel: Int {
                  lock.lock()
                  defer { lock.unlock() }
                  return perfLevelStore
              }

              // Vom Renderer gelesen
              private(set) var gain: Double = 1.0
              private(set) var noise: Double = 0.0
              private(set) var mean: Double = 0.5
              private(set) var p90: Double = 0.85
              private(set) var darkFrac: Double = 0.0
              /// Gemessene Stream-Bitrate in Mbit/s (0 = unbekannt). Wird von StreamView
              /// einmal pro Sekunde geschrieben.
              private(set) var streamMbps: Double = 0.0

              /// Gemessene GPU-Zeit pro Bild in Millisekunden (gleitender Mittelwert).
              /// 16,6 ms = 60 fps. Alles darunter ist Reserve, alles darueber kostet Bilder.
              var renderMs: Double {
                  lock.lock()
                  defer { lock.unlock() }
                  return renderMsEma
              }

              func noteRenderMs(_ ms: Double) {
                  lock.lock()
                  renderMsEma += (ms - renderMsEma) * 0.08
                  // Lastregel in zwei Stufen. WICHTIG: Die Stufe muss im Renderer auch
                  // gelesen werden (draw() fragt scene.perfLevel ab). Vorher war sie nur
                  // eine Anzeige und hat nichts abgeschaltet.
                  //   Stufe 1 (ueber 21 ms): Klarheit aus  — kaum sichtbar
                  //   Stufe 2 (ueber 26 ms): zusaetzlich Deconvolution aus, Dimming halb
                  // Rueckweg mit 8 s Sperre, damit es nicht flattert.
                  let now = CACurrentMediaTime()
                  // Die Lastregel ist standardmaessig AUS. Sie hat in Build 95 die
                  // Deconvolution abgeschaltet, sobald das iPad warm wurde — das Bild
                  // verlor dadurch 25-27 % Textur. Bildqualitaet geht vor Bildrate.
                  let autoPerf = (UserDefaults.standard.object(forKey: "pxSharpPerfAuto") as? NSNumber)?.boolValue ?? false
                  if !autoPerf {
                      perfLevelStore = 0
                      lock.unlock()
                      return
                  }
                  if perfLevelStore == 0 && renderMsEma > 24.0 {
                      perfLevelStore = 1
                      perfCooldown = now + 8.0
                  } else if perfLevelStore == 1 && renderMsEma > 30.0 {
                      perfLevelStore = 2
                      perfCooldown = now + 8.0
                  } else if perfLevelStore == 2 && now > perfCooldown && renderMsEma < 24.0 {
                      perfLevelStore = 1
                      perfCooldown = now + 8.0
                  } else if perfLevelStore == 1 && now > perfCooldown && renderMsEma < 18.0 {
                      perfLevelStore = 0
                  }
                  lock.unlock()
              }

              private init() {}

              func reset() {
                  lock.lock()
                  gainEma = 1.0; noiseEma = 0.0; gain = 1.0; noise = 0.0
                  lock.unlock()
              }

              /// Analysiert hoechstens 10x pro Sekunde. Das reicht fuer Belichtung und
              /// Rauschen und kostet praktisch keine Bildrate.
              func analyze(_ pb: CVPixelBuffer) {
                  let now = CACurrentMediaTime()
                  lock.lock()
                  if now - lastAnalysis < 0.10 { lock.unlock(); return }
                  lastAnalysis = now
                  lock.unlock()

                  guard CVPixelBufferGetPlaneCount(pb) >= 1 else { return }
                  CVPixelBufferLockBaseAddress(pb, .readOnly)
                  defer { CVPixelBufferUnlockBaseAddress(pb, .readOnly) }
                  guard let base = CVPixelBufferGetBaseAddressOfPlane(pb, 0) else { return }

                  let w = CVPixelBufferGetWidthOfPlane(pb, 0)
                  let h = CVPixelBufferGetHeightOfPlane(pb, 0)
                  let bpr = CVPixelBufferGetBytesPerRowOfPlane(pb, 0)
                  guard w > 32, h > 32 else { return }
                  // 10-Bit-Streams liefern 16-Bit-Worte (0..1023). Der Analysator muss
                  // das erkennen, sonst waeren alle Szenenwerte um Faktor 4 falsch.
                  let fmtType = CVPixelBufferGetPixelFormatType(pb)
                  let isTenBit = (fmtType == kCVPixelFormatType_420YpCbCr10BiPlanarVideoRange
                                  || fmtType == kCVPixelFormatType_420YpCbCr10BiPlanarFullRange)
                  let maxVal = isTenBit ? 1023.0 : 255.0
                  let p = base.assumingMemoryBound(to: UInt8.self)
                  let p16 = base.assumingMemoryBound(to: UInt16.self)
                  func luma(_ x: Int, _ y: Int) -> Double {
                      if isTenBit { return Double(p16[y * (bpr / 2) + x]) / maxVal * 255.0 }
                      return Double(p[y * bpr + x]) / maxVal * 255.0
                  }

                  var hist = [Int](repeating: 0, count: 256)
                  var n = 0
                  var flatSum = 0.0
                  var flatN = 0
                  var darkSum = 0.0
                  var darkN = 0
                  var y = 4
                  while y < h - 4 {
                      let row = y * bpr
                      var x = 4
                      while x < w - 6 {
                          let v = Int(luma(x, y))
                          hist[v] += 1
                          n += 1
                          // Rauschen nur in FLACHEN Stellen messen: nur wenn auch der
                          // Pixel 2 Stellen weiter fast gleich ist. Sonst misst man
                          // Textur statt Rauschen.
                          let v1 = Int(luma(x + 1, y))
                          let v2 = Int(luma(x + 2, y))
                          let d = abs(v1 - v)
                          if abs(v2 - v) <= 6 && d <= 24 {
                              flatSum += Double(d)
                              flatN += 1
                          }
                          if v < 90 { darkSum += Double(v); darkN += 1 }
                          x += 6
                      }
                      y += 6
                  }
                  guard n > 200 else { return }

                  func pct(_ q: Double) -> Double {
                      let target = Int(Double(n) * q)
                      var acc = 0
                      for i in 0..<256 {
                          acc += hist[i]
                          if acc >= target { return Double(i) / 255.0 }
                      }
                      return 1.0
                  }

                  let p10 = pct(0.10)
                  let p50 = pct(0.50)
                  let p90 = pct(0.90)

                  // Belichtungsziel: Median ~0.46, Spitzlicht ~0.86.
                  // min() sorgt dafuer, dass niemals Highlights fuer die Mitten geopfert werden.
                  let gMid = 0.40 / max(p50, 0.06)
                  let gHigh = 0.78 / max(p90, 0.12)
                  // Bewusst enger Regelbereich: eine Nacht bleibt Nacht. Die Automatik
                  // korrigiert Belichtungsfehler, sie erfindet keine Helligkeit.
                  // Grenze nach oben szenenabhaengig: eine sehr dunkle Szene (Median < 0,18)
                  // darf bis +30 % aufgehellt werden, eine normale nur bis +12 %.
                  let capHigh = min(1.32, 1.12 + max(0.0, 0.18 - p50) * 1.6)
                  var g = min(gMid, gHigh, capHigh)
                  g = max(g, 0.64)

                  // Rauschen: mittlerer Gradient in flachen Stellen. Sauber ~0.3-1.0,
                  // verrauscht 2-6 (Stufen/255).
                  let grad = flatN > 0 ? flatSum / Double(flatN) : 0.0
                  let nz = min(max((grad - 0.7) / 3.5, 0.0), 1.0)
                  // Wie dunkel ist die Szene wirklich? (Anteil unter 90/255)
                  let darkFrac = n > 0 ? Double(darkN) / Double(n) : 0.0
                  _ = darkSum

                  // Bitrate der Leitung mitlesen: bestimmt, wie stark komprimiert das
                  // Bild ist — und damit, wie viel Filter bzw. Schaerfe sinnvoll ist.
                  let mb = UserDefaults.standard.string(forKey: "pxSharpStreamMbps").flatMap { Double($0) } ?? 0.0

                  lock.lock()
                  streamMbps = mb
                  // Asymmetrische Glaettung: schnell runter (nicht ueberbelichten),
                  // langsam hoch. Verhindert Pumpen bei Szenenwechseln.
                  let a = g < gainEma ? 0.18 : 0.07
                  gainEma += (g - gainEma) * a
                  noiseEma += (nz - noiseEma) * 0.15
                  gain = gainEma
                  noise = noiseEma
                  mean = p50
                  self.p90 = p90
                  self.darkFrac = darkFrac
                  lock.unlock()
              }
          }

          // MARK: - PXProbe: Messung direkt in der App
          /// Rendert das zuletzt angezeigte Bild und berechnet Bildkennzahlen auf dem
          /// Gerät. Damit ist eine Messung in ~100 ms möglich, exakt auf demselben Bild,
          /// ohne Screenshot-Umweg. Zusätzlich wird die Bewegung zwischen zwei Probes
          /// gemeldet, damit man weiß, ob ein Vergleich überhaupt gültig ist.
          final class PXProbe {
              static let shared = PXProbe()
              private let lock = NSLock()
              private var image: CIImage?
              private var ctx: CIContext?
              private var space: CGColorSpace?
              private var w = 0
              private var h = 0
              private var prevLuma: [Float]?
              private var lastBuffer: CVPixelBuffer?
              private(set) var frozenBuffer: CVPixelBuffer?

              func note(_ pb: CVPixelBuffer) {
                  lock.lock()
                  lastBuffer = pb
                  lock.unlock()
              }

              /// Gibt Bild und Kontext frei. Wird beim Kontext-Neuaufbau gerufen --
              /// sonst haelt der Probe den alten CIContext samt Textur-Pools am Leben
              /// und der Speicher sinkt nie.
              func clear() {
                  lock.lock()
                  image = nil
                  ctx = nil
                  space = nil
                  w = 0
                  h = 0
                  prevLuma = nil
                  lastBuffer = nil
                  frozenBuffer = nil
                  lock.unlock()
              }

              /// Friert das Quellbild ein, damit alle folgenden Messungen exakt dasselbe
              /// Bild verarbeiten. Ohne das misst man bei laufendem Spiel Szenenwechsel
              /// statt Einstellungsunterschiede.
              func freeze(_ on: Bool) {
                  lock.lock()
                  if on {
                      if let src = lastBuffer { frozenBuffer = PXProbe.copyBuffer(src) }
                  } else {
                      frozenBuffer = nil
                  }
                  lock.unlock()
              }

              static func copyBuffer(_ src: CVPixelBuffer) -> CVPixelBuffer? {
                  let w = CVPixelBufferGetWidth(src)
                  let h = CVPixelBufferGetHeight(src)
                  let fmt = CVPixelBufferGetPixelFormatType(src)
                  var dst: CVPixelBuffer?
                  let attrs: [String: Any] = [
                      kCVPixelBufferIOSurfacePropertiesKey as String: [:] as [String: Any]
                  ]
                  CVPixelBufferCreate(kCFAllocatorDefault, w, h, fmt, attrs as CFDictionary, &dst)
                  guard let d = dst else { return nil }
                  CVBufferPropagateAttachments(src, d)
                  CVPixelBufferLockBaseAddress(src, .readOnly)
                  CVPixelBufferLockBaseAddress(d, [])
                  let planes = CVPixelBufferIsPlanar(src) ? CVPixelBufferGetPlaneCount(src) : 1
                  for i in 0..<max(1, planes) {
                      if CVPixelBufferIsPlanar(src) {
                          guard let sb = CVPixelBufferGetBaseAddressOfPlane(src, i),
                                let db = CVPixelBufferGetBaseAddressOfPlane(d, i) else { continue }
                          let bh = CVPixelBufferGetHeightOfPlane(src, i)
                          let brs = CVPixelBufferGetBytesPerRowOfPlane(src, i)
                          let brd = CVPixelBufferGetBytesPerRowOfPlane(d, i)
                          let n = min(brs, brd)
                          for y in 0..<bh {
                              memcpy(db.advanced(by: y * brd), sb.advanced(by: y * brs), n)
                          }
                      } else {
                          guard let sb = CVPixelBufferGetBaseAddress(src),
                                let db = CVPixelBufferGetBaseAddress(d) else { continue }
                          memcpy(db, sb, CVPixelBufferGetBytesPerRow(src) * h)
                      }
                  }
                  CVPixelBufferUnlockBaseAddress(d, [])
                  CVPixelBufferUnlockBaseAddress(src, .readOnly)
                  return d
              }

              func set(_ img: CIImage, context: CIContext, space: CGColorSpace, width: Int, height: Int) {
                  lock.lock()
                  image = img
                  ctx = context
                  self.space = space
                  w = width
                  h = height
                  lock.unlock()
              }

              /// Rendert das aktuelle Bild als JPEG (max. 1200 px breit) und gibt es
              /// base64-kodiert zurück. Fuer die visuelle Kontrolle von Farbe/Schaerfe
              /// ohne USB-Verbindung.
              func shotJPEG(maxW: Int = 1200) -> String {
                  shotImage(maxW: maxW, png: false)
              }

              /// Verlustfreie Aufnahme (PNG). Wichtig fuer Messungen: JPEG rechnet in
              /// 4:2:0 herunter und halbiert damit die Farbaufloesung — Farbkanten und
              /// Banding lassen sich damit nicht ehrlich beurteilen.
              func shotPNG(maxW: Int = 1920) -> String {
                  shotImage(maxW: maxW, png: true)
              }

              private func shotImage(maxW: Int, png: Bool) -> String {
                  lock.lock()
                  guard let img = image, let ctx = ctx, let sp = space, w > 8, h > 8 else {
                      lock.unlock()
                      return "{\"ok\":false}"
                  }
                  let W = w, H = h
                  lock.unlock()

                  let scale = min(1.0, Double(maxW) / Double(W))
                  let ow = max(8, Int(Double(W) * scale))
                  let oh = max(8, Int(Double(H) * scale))
                  let small = img.transformed(by: CGAffineTransform(scaleX: CGFloat(scale), y: CGFloat(scale)))
                  guard let cg = ctx.createCGImage(small, from: CGRect(x: 0, y: 0, width: ow, height: oh),
                                                   format: .RGBA8, colorSpace: sp) else {
                      return "{\"ok\":false}"
                  }
                  let ui = UIImage(cgImage: cg)
                  let data: Data?
                  if png {
                      data = ui.pngData()
                  } else {
                      data = ui.jpegData(compressionQuality: 0.88)
                  }
                  guard let d = data else { return "{\"ok\":false}" }
                  let b64 = d.base64EncodedString()
                  let fmt = png ? "png" : "jpeg"
                  return "{\"ok\":true,\"w\":\(ow),\"h\":\(oh),\"\(fmt)\":\"\(b64)\"}"
              }

              func probe() -> String {
                  lock.lock()
                  guard let img = image, let ctx = ctx, let sp = space, w > 8, h > 8 else {
                      lock.unlock()
                      return "{\"ok\":false}"
                  }
                  let W = w, H = h
                  lock.unlock()

                  var buf = [UInt8](repeating: 0, count: W * H * 4)
                  let rect = CGRect(x: 0, y: 0, width: W, height: H)
                  buf.withUnsafeMutableBytes { raw in
                      ctx.render(img, toBitmap: raw.baseAddress!, rowBytes: W * 4,
                                 bounds: rect, format: .RGBA8, colorSpace: sp)
                  }

                  // Luma + Zeilensummen in einem Durchgang
                  var luma = [Float](repeating: 0, count: W * H)
                  var rowSum = [Double](repeating: 0, count: H)
                  buf.withUnsafeBufferPointer { p in
                      let b = p.baseAddress!
                      for y in 0..<H {
                          var rs: Double = 0
                          let row = y * W * 4
                          for x in 0..<W {
                              let i = row + x * 4
                              let l = 0.299 * Float(b[i]) + 0.587 * Float(b[i + 1]) + 0.114 * Float(b[i + 2])
                              luma[y * W + x] = l
                              rs += Double(l)
                          }
                          rowSum[y] = rs / Double(W)
                      }
                  }

                  var r0 = 0, r1 = H - 1
                  while r0 < H && rowSum[r0] <= 6 { r0 += 1 }
                  while r1 > r0 && rowSum[r1] <= 6 { r1 -= 1 }
                  if r1 - r0 < 16 { r0 = 0; r1 = H - 1 }

                  var sR = 0.0, sG = 0.0, sB = 0.0, sL = 0.0, sL2 = 0.0
                  var chromaSum = 0.0, satSum = 0.0, satN = 0
                  var clip = 0, black = 0, n = 0
                  var lapSum = 0.0, lapSq = 0.0, lapN = 0
                  var flatSum = 0.0, flatN = 0

                  buf.withUnsafeBufferPointer { p in
                      let b = p.baseAddress!
                      for y in r0...r1 {
                          let row = y * W * 4
                          for x in 0..<W {
                              let i = row + x * 4
                              let r = Double(b[i]), g = Double(b[i + 1]), bl = Double(b[i + 2])
                              sR += r; sG += g; sB += bl
                              let l = 0.299 * r + 0.587 * g + 0.114 * bl
                              sL += l; sL2 += l * l
                              let mx = max(r, max(g, bl))
                              let mn = min(r, min(g, bl))
                              chromaSum += mx - mn
                              if mx > 4 { satSum += (mx - mn) / mx; satN += 1 }
                              if mx >= 254 { clip += 1 }
                              if mx <= 1 { black += 1 }
                              n += 1
                              if x > 0 && x < W - 1 && y > r0 && y < r1 {
                                  let li = y * W + x
                                  let lp = luma[li]
                                  let lap = abs(4 * lp - luma[li - 1] - luma[li + 1] - luma[li - W] - luma[li + W])
                                  lapSum += Double(lap); lapSq += Double(lap * lap); lapN += 1
                                  let grad = abs(luma[li - 1] - luma[li + 1]) + abs(luma[li - W] - luma[li + W])
                                  if grad < 12 {
                                      flatSum += Double(lap); flatN += 1
                                  }
                              }
                          }
                      }
                  }
                  if n == 0 { return "{\"ok\":false}" }
                  let mean = sL / Double(n)
                  let std = max(0, sL2 / Double(n) - mean * mean).squareRoot()
                  let lapVar = lapN > 0 ? (lapSq / Double(lapN) - (lapSum / Double(lapN)) * (lapSum / Double(lapN))) : 0
                  let flatNoise = flatN > 0 ? flatSum / Double(flatN) : 0

                  // Bewegung gegenüber der letzten Messung: nur gültig, wenn Bild steht
                  var motion = -1.0
                  lock.lock()
                  if let prev = prevLuma, prev.count == luma.count {
                      var d: Double = 0
                      var cn = 0
                      var i = 0
                      let step = 7
                      while i < luma.count {
                          d += Double(abs(luma[i] - prev[i])); cn += 1
                          i += step
                      }
                      motion = cn > 0 ? d / Double(cn) : 0
                  }
                  prevLuma = luma
                  lock.unlock()

                  let o: [String: Any] = [
                      "ok": true,
                      "w": W, "h": H, "rows": r1 - r0 + 1,
                      "r": sR / Double(n), "g": sG / Double(n), "b": sB / Double(n),
                      "mean": mean, "std": std,
                      "lap": lapVar, "acu": lapVar / max(std * std, 0.0001),
                      "clip": Double(clip) / Double(n) * 100.0,
                      "black": Double(black) / Double(n) * 100.0,
                      "noise": flatNoise,
                      "chroma": chromaSum / Double(n),
                      "sat": satN > 0 ? satSum / Double(satN) : 0,
                      "motion": motion
                  ]
                  if let data = try? JSONSerialization.data(withJSONObject: o, options: [.sortedKeys]) {
                      return String(data: data, encoding: .utf8) ?? "{\"ok\":false}"
                  }
                  return "{\"ok\":false}"
              }
          }

          // MARK: - PXTuner: Debug-Bruecke fuer automatisierte Bildtests
          /// Kleiner HTTP-Server auf Port 8766. Erlaubt das Lesen und Setzen aller
          /// pxSharp-*-Werte, waehrend der Stream laeuft. Der Renderer liest
          /// UserDefaults in jedem Frame, Aenderungen wirken daher sofort.
          final class PXTuner {
              static let shared = PXTuner()
              private var listener: NWListener?
              private let queue = DispatchQueue(label: "px.tuner")

              func start() {
                  guard listener == nil else { return }
                  let params = NWParameters.tcp
                  params.allowLocalEndpointReuse = true
                  guard let port = NWEndpoint.Port(rawValue: 8766),
                        let l = try? NWListener(using: params, on: port) else { return }
                  l.newConnectionHandler = { conn in
                      conn.start(queue: self.queue)
                      conn.receive(minimumIncompleteLength: 1, maximumLength: 16384) { data, _, _, _ in
                          let req = data.flatMap { String(data: $0, encoding: .utf8) } ?? ""
                          let body = PXTuner.handle(req)
                          let head = "HTTP/1.1 200 OK\r\nContent-Type: application/json; charset=utf-8\r\nContent-Length: \(body.utf8.count)\r\nConnection: close\r\n\r\n"
                          conn.send(content: (head + body).data(using: .utf8),
                                    completion: .contentProcessed { _ in conn.cancel() })
                      }
                  }
                  l.start(queue: queue)
                  listener = l
                  os_log(.default, log: videoViewLog, "[PXTuner] listening on 8766")
              }

              private static func handle(_ req: String) -> String {
                  let line = req.split(separator: "\r\n").first.map(String.init) ?? ""
                  let parts = line.split(separator: " ")
                  guard parts.count >= 2 else { return "{\"error\":\"bad request\"}" }
                  let path = String(parts[1])
                  let comps = URLComponents(string: "http://x" + path)
                  let items = comps?.queryItems ?? []
                  func val(_ n: String) -> String? { items.first(where: { $0.name == n })?.value }
                  let d = UserDefaults.standard

                  if path.hasPrefix("/set"), let k = val("key"), let v = val("value"),
                     k.hasPrefix("pxSharp") || k == "bitrate" {
                      if k == "bitrate" {
                          // Stream-Bitrate in kbit/s (0 = automatisch). Wirkt beim naechsten
                          // Verbinden. Wichtig: 1080p H.265 laeuft "automatisch" nur mit
                          // 12000 kbit/s — das ist der Deckel, den man hier anheben kann.
                          var p = StreamPreferences.load()
                          p.bitrate = max(0, min(50000, Int(v) ?? 0))
                          p.save()
                          return "{\"ok\":true,\"bitrate\":\(p.effectiveBitrate),\"pref\":\(p.bitrate)}"
                      }
                      if v == "true" || v == "false" { d.set(v == "true", forKey: k) }
                      else if let i = Int(v) { d.set(i, forKey: k) }
                      else if let f = Double(v) { d.set(f, forKey: k) }
                      else { d.set(v, forKey: k) }
                      return "{\"ok\":true,\"key\":\"\(k)\"}"
                  }
                  if path.hasPrefix("/freeze") {
                      let on = val("on") == "1"
                      PXProbe.shared.freeze(on)
                      return "{\"ok\":true,\"frozen\":\(on)}"
                  }
                  if path.hasPrefix("/probe") {
                      return PXProbe.shared.probe()
                  }
                  if path.hasPrefix("/shot") {
                      // Aktuelles Bild als JPEG (base64). ?w=2732 liefert volle Panelbreite
                      // fuer 1:1-Ausschnitte. ?fmt=png liefert verlustfrei (fuer Messungen).
                      let w = Int(val("w") ?? "") ?? 1200
                      let width = min(max(w, 200), 2732)
                      if val("fmt") == "png" {
                          return PXProbe.shared.shotPNG(maxW: min(width, 1920))
                      }
                      return PXProbe.shared.shotJPEG(maxW: width)
                  }
                  if path.hasPrefix("/state") {
                      var o: [String: Any] = [:]
                      for (k, v) in d.dictionaryRepresentation() where k.hasPrefix("pxSharp") { o[k] = "\(v)" }
                      o["_bundle"] = Bundle.main.bundleIdentifier ?? "?"
                      o["_version"] = Bundle.main.infoDictionary?["CFBundleVersion"] as? String ?? "?"
                      // Szenenanalyse sichtbar machen (Automatik nachvollziehen)
                      o["pxAutoGain"] = String(format: "%.3f", PXScene.shared.gain)
                      o["pxAutoNoise"] = String(format: "%.3f", PXScene.shared.noise)
                      o["pxSceneMedian"] = String(format: "%.3f", PXScene.shared.mean)
                      o["pxSceneP90"] = String(format: "%.3f", PXScene.shared.p90)
                      o["pxRenderMs"] = String(format: "%.2f", PXScene.shared.renderMs)
                      o["pxScreenBrightness"] = String(format: "%.2f", Double(UIScreen.main.brightness))
                      o["pxPerfLevel"] = String(PXScene.shared.perfLevel)
                      // Angeforderte Bitrate sichtbar machen: 0 = automatisch (1080p H.265
                      // = 12000 kbit/s). Genau dieser Automatikwert war der Deckel.
                      // Speicher im Blick behalten: sporadische Abstuerze sind meist
                      // Speicherdruck. phys_footprint ist das, was iOS wirklich zaehlt.
                      var vmInfo = task_vm_info_data_t()
                      var vmCount = mach_msg_type_number_t(MemoryLayout<task_vm_info_data_t>.size / MemoryLayout<natural_t>.size)
                      let vmKr = withUnsafeMutablePointer(to: &vmInfo) {
                          $0.withMemoryRebound(to: integer_t.self, capacity: Int(vmCount)) {
                              task_info(mach_task_self_, task_flavor_t(TASK_VM_INFO), $0, &vmCount)
                          }
                      }
                      if vmKr == KERN_SUCCESS {
                          let mb = Double(vmInfo.phys_footprint) / 1_048_576.0
                          o["pxMemMB"] = String(format: "%.0f", mb)
                          let peak = UserDefaults.standard.double(forKey: "pxMemPeak")
                          if mb > peak { UserDefaults.standard.set(mb, forKey: "pxMemPeak") }
                          o["pxMemPeakMB"] = String(format: "%.0f", max(peak, mb))
                      }
                      o["pxLastBeat"] = String(format: "%.0f", Date().timeIntervalSince1970)
                      o["pxNeuralRun"] = String(PXNeuralDenoise.shared.ranCount)
                      o["pxNeuralMs"] = String(format: "%.2f", PXNeuralDenoise.shared.avgMs)
                  o["pxNeuralMsg"] = UserDefaults.standard.string(forKey: "pxNeuralMsg") ?? ""
                  o["pxAvSent"] = String(UserDefaults.standard.integer(forKey: "pxAvSent"))
                  o["pxAvDrop"] = String(UserDefaults.standard.integer(forKey: "pxAvDrop"))
                  o["pxSharpAvSkip"] = UserDefaults.standard.bool(forKey: "pxSharpAvSkip") ? "1" : "0"
                  o["pxSharpAvSkipped"] = String(UserDefaults.standard.integer(forKey: "pxSharpAvSkipped"))
                  o["pxSharpAvFlushEvery"] = String(UserDefaults.standard.integer(forKey: "pxSharpAvFlushEvery"))
                  o["pxAiUpRun"] = String(PXAiUpscale.shared.ranCount)
                  o["pxAiUpMs"] = String(format: "%.2f", PXAiUpscale.shared.avgMs)
                  o["pxAiUpConv"] = String(format: "%.2f", PXAiUpscale.shared.convMs)
                  o["pxAiUpNet"] = String(format: "%.2f", PXAiUpscale.shared.netMs)
                  o["pxAiUpMsg"] = PXAiUpscale.shared.msg
                  o["pxLumaMs"] = String(format: "%.2f", PXLumaDetail.shared.avgMs)
                  o["pxLumaRun"] = String(PXLumaDetail.shared.ranCount)
                  o["pxLumaMsg"] = PXLumaDetail.shared.msg
                  o["pxLinkHz"] = UserDefaults.standard.string(forKey: "pxLinkHzValue") ?? "-"
                  o["pxPace120"] = ((UserDefaults.standard.object(forKey: "pxSharpPace120") as? NSNumber)?.boolValue ?? true) ? "an" : "aus"
                  o["pxAccumShift"] = PXAccumulate.shared.msg
                  o["pxAccumMs"] = String(format: "%.2f", PXAccumulate.shared.costMs)
                  o["pxLutBuilds"] = String(UserDefaults.standard.integer(forKey: "pxLutBuildsTotal"))
                  o["pxFill"] = UserDefaults.standard.bool(forKey: "pxSharpFill") ? "an" : "aus"
                  o["pxProfile"] = UserDefaults.standard.string(forKey: "pxProfileText") ?? "-"
                  let mbpsNow = Double(UserDefaults.standard.string(forKey: "pxSharpStreamMbps") ?? "") ?? 0.0
                  let gateOn = (UserDefaults.standard.object(forKey: "pxSharpAiAutoBitrate") as? NSNumber)?.boolValue ?? true
                  let gateLimit = (UserDefaults.standard.object(forKey: "pxSharpAiGateMbit") as? Double) ?? 18.0
                  if !gateOn { o["pxNetGate"] = "aus" }
                  else if mbpsNow <= 0.1 { o["pxNetGate"] = "offen (unbekannt)" }
                  else { o["pxNetGate"] = mbpsNow < gateLimit ? "offen" : "zu" }
                  // Fuer die Einstellungen: Tempo und Klartext direkt unter dem Schalter.
                  UserDefaults.standard.set(PXAiUpscale.shared.msg, forKey: "pxAiUpMsgUI")
                  UserDefaults.standard.set(String(format: "%.0f", PXAiUpscale.shared.convMs), forKey: "pxAiUpConvUI")
                  UserDefaults.standard.set(String(format: "%.0f", PXAiUpscale.shared.netMs), forKey: "pxAiUpNetUI")
                  o["pxNeuralPause"] = String(format: "%.1f", PXNeuralDenoise.shared.pauseLeft())
                      let prefs = StreamPreferences.load()
                      o["pxBitratePref"] = String(prefs.bitrate)
                      o["pxRequestedBitrate"] = String(prefs.effectiveBitrate)
                      o["pxReqRes"] = "\(prefs.resolution.width)x\(prefs.resolution.height)"
                      let hz = UIScreen.main.maximumFramesPerSecond
                      d.set(String(hz), forKey: "pxSharpHz")
                      o["pxSharpHz"] = String(hz)
                      o["pxSharpDecodeFPS"] = d.string(forKey: "pxSharpDecodeFPS") ?? "-"
                      // Thermischer Zustand des iPads: nominal / fair / serious / critical.
                      // Damit laesst sich belegen, ob Einbrueche von der Waerme kommen.
                      switch ProcessInfo.processInfo.thermalState {
                      case .nominal: o["pxThermal"] = "nominal"
                      case .fair: o["pxThermal"] = "fair"
                      case .serious: o["pxThermal"] = "serious"
                      case .critical: o["pxThermal"] = "critical"
                      @unknown default: o["pxThermal"] = "?"
                      }
                      o["pxLowPower"] = ProcessInfo.processInfo.isLowPowerModeEnabled ? "1" : "0"
                      o["pxBitrateFactor"] = String(format: "%.2f", min(max((PXScene.shared.streamMbps - 7.0) / 15.0, 0.0), 1.0))
                      o["pxSceneDark"] = String(format: "%.3f", PXScene.shared.darkFrac)
                      if let data = try? JSONSerialization.data(withJSONObject: o, options: [.sortedKeys]) {
                          return String(data: data, encoding: .utf8) ?? "{}"
                      }
                  }
                  return "{\"ok\":false}"
              }
          }

          // PXNeuralDenoise.swift
          // Neuronales Entrauschen im Spiel.
          // Das Netz (4 Faltungen, 20.259 Gewichte) wurde auf den eigenen Aufnahmen
          // trainiert: 3/5/8 Mbit rein, 12 Mbit als Ziel.
          // Gemessen: Tag -34 % Korn bei +2 % Detail, Abend -15 %, Nacht +19 %.
          // Deshalb laeuft es nur bei Szenenhelligkeit ueber 0.20.

          import Foundation
          import CoreML
          import Vision
          import CoreImage

          final class PXNeuralDenoise {

              static let shared = PXNeuralDenoise()

              private var model: MLModel?
              private var vnModel: VNCoreMLModel?
              private var tried = false
              private var request: VNCoreMLRequest?

              /// Gemessene Inferenzzeit (gleitender Mittelwert)
              private(set) var avgMs: Double = 0
              /// Zuletzt gemessene Zeit
              private(set) var lastMs: Double = 0
              /// Wenn das Netz zu langsam ist, pausiert es kurz (kein Ruckeln)
              private var pauseUntil: CFTimeInterval = 0
              /// Zaehlt, wie oft das Netz wirklich gerechnet hat
              private(set) var ranCount: Int = 0

              private let lock = NSLock()

              // MARK: - Laden

              func ensureLoaded() -> Bool {
                  lock.lock()
                  defer { lock.unlock() }
                  if tried { return vnModel != nil }
                  tried = true
                  guard let url = Bundle.main.url(forResource: "pxdenoise", withExtension: "mlmodelc") else {
                      os_log(.error, log: videoViewLog, "[PXNeural] pxdenoise.mlmodelc fehlt im Bundle")
                      return false
                  }
                  do {
                      let cfg = MLModelConfiguration()
                      cfg.computeUnits = .all
                      let ml = try MLModel(contentsOf: url, configuration: cfg)
                      let vn = try VNCoreMLModel(for: ml)
                      let req = VNCoreMLRequest(model: vn)
                      req.imageCropAndScaleOption = .scaleFill
                      self.model = ml
                      self.vnModel = vn
                      self.request = req
                      os_log(.default, log: videoViewLog, "[PXNeural] Modell geladen")
                      return true
                  } catch {
                      os_log(.error, log: videoViewLog, "[PXNeural] Laden fehlgeschlagen: %{public}s", "\(error)")
                      return false
                  }
              }

              // MARK: - Umwandlung fuer Core ML

              private var convContext: CIContext?
              private var convBuffer: CVPixelBuffer?

              /// Wandelt ein YUV-Bild in 32BGRA um: das einzige Format, das Core ML
              /// als Bildeingang akzeptiert. Der Puffer wird wiederverwendet, damit pro
              /// Bild keine neue Flaeche angefordert werden muss.
              private func bgraBuffer(from pb: CVPixelBuffer) -> CVPixelBuffer? {
                  let w = CVPixelBufferGetWidth(pb), h = CVPixelBufferGetHeight(pb)
                  if convContext == nil {
                      convContext = CIContext(options: [.cacheIntermediates: false])
                  }
                  if convBuffer == nil || CVPixelBufferGetWidth(convBuffer!) != w || CVPixelBufferGetHeight(convBuffer!) != h {
                      var out: CVPixelBuffer?
                      let attrs: [String: Any] = [
                          kCVPixelBufferIOSurfacePropertiesKey as String: [:] as [String: Any]
                      ]
                      CVPixelBufferCreate(kCFAllocatorDefault, w, h, kCVPixelFormatType_32BGRA,
                                          attrs as CFDictionary, &out)
                      convBuffer = out
                  }
                  guard let dst = convBuffer, let ctx = convContext else { return nil }
                  ctx.render(CIImage(cvPixelBuffer: pb), to: dst)
                  return dst
              }

              /// Sehr schnelle Helligkeitsprobe: liest nur ein Raster von Punkten aus.
              /// Erkennt ein schwarzes Ergebnis, ohne das ganze Bild zu durchsuchen.
              private func meanLuma(_ pb: CVPixelBuffer) -> Double {
                  let fmt = CVPixelBufferGetPixelFormatType(pb)
                  guard fmt == kCVPixelFormatType_32BGRA || fmt == kCVPixelFormatType_32ARGB else { return 128.0 }
                  CVPixelBufferLockBaseAddress(pb, .readOnly)
                  defer { CVPixelBufferUnlockBaseAddress(pb, .readOnly) }
                  guard let base = CVPixelBufferGetBaseAddress(pb) else { return 128.0 }
                  let w = CVPixelBufferGetWidth(pb), h = CVPixelBufferGetHeight(pb)
                  let bpr = CVPixelBufferGetBytesPerRow(pb)
                  let bytes = base.assumingMemoryBound(to: UInt8.self)
                  var sum = 0.0, n = 0.0
                  let stepX = max(1, w / 16), stepY = max(1, h / 16)
                  var y = 0
                  while y < h {
                      var x = 0
                      while x < w {
                          let p = bytes + y * bpr + x * 4
                          sum += 0.114 * Double(p[0]) + 0.587 * Double(p[1]) + 0.299 * Double(p[2])
                          n += 1
                          x += stepX
                      }
                      y += stepY
                  }
                  return n > 0 ? sum / n : 128.0
              }

              // MARK: - Anwenden

              /// Gibt ein entrauschtes Pixelbuffer zurueck, oder nil wenn nicht angewendet.
              /// `brightness` ist die gemessene Szenenhelligkeit (0...1).
              func process(_ pixelBuffer: CVPixelBuffer, brightness: Double) -> CVPixelBuffer? {
                  let d = UserDefaults.standard
                  guard (d.object(forKey: "pxSharpNeural") as? Bool) ?? true else { return nil }
                  let minBright = (d.object(forKey: "pxSharpNeuralMinBright") as? Double) ?? 0.20
                  guard brightness >= minBright else { return nil }
                  let now = CACurrentMediaTime()
                  if now < pauseUntil { return nil }
                  guard ensureLoaded(), let req = request else { return nil }

                  let t0 = CACurrentMediaTime()
                  // GEMESSEN: der direkte Core-ML-Weg liefert ein SCHWARZES Bild.
                  // Mit Netz an waren 24 von 24 Aufnahmen schwarz, mit Netz aus 0 von 24.
                  // Deshalb geht es wieder ueber Vision -- das hat in 196 nachweislich
                  // funktioniert und wandelt beide Richtungen richtig um.
                  // Der schnelle Weg bleibt als Schalter pxNeuralFast erhalten.
                  var outBuf: CVPixelBuffer?
                  let fast = UserDefaults.standard.bool(forKey: "pxNeuralFast")
                  if fast {
                      let fmt = CVPixelBufferGetPixelFormatType(pixelBuffer)
                      let src = (fmt == kCVPixelFormatType_32BGRA) ? pixelBuffer : (bgraBuffer(from: pixelBuffer) ?? pixelBuffer)
                      if let model = self.model,
                         let provider = try? MLDictionaryFeatureProvider(dictionary: [
                             "input": MLFeatureValue(pixelBuffer: src)
                         ]),
                         let result = try? model.prediction(from: provider) {
                          outBuf = result.featureValue(for: "output")?.imageBufferValue
                          UserDefaults.standard.set("direkt", forKey: "pxNeuralMsg")
                      } else {
                          UserDefaults.standard.set("direkt fehlgeschlagen", forKey: "pxNeuralMsg")
                      }
                  }
                  if outBuf == nil, let req = request {
                      let handler = VNImageRequestHandler(cvPixelBuffer: pixelBuffer, options: [:])
                      if (try? handler.perform([req])) != nil,
                         let obs = req.results?.first as? VNPixelBufferObservation {
                          outBuf = obs.pixelBuffer
                          UserDefaults.standard.set("Vision", forKey: "pxNeuralMsg")
                      }
                  }
                  guard let outBuf = outBuf else { return nil }
                  // Sicherung gegen schwarze Bilder: das Ergebnis muss dieselbe Groesse
                  // haben wie die Eingabe. Sonst verwerfen und das Original behalten.
                  let inW = CVPixelBufferGetWidth(pixelBuffer), inH = CVPixelBufferGetHeight(pixelBuffer)
                  let outW = CVPixelBufferGetWidth(outBuf), outH = CVPixelBufferGetHeight(outBuf)
                  if inW != outW || inH != outH {
                      os_log(.error, log: videoViewLog, "[PXNeural] Groesse passt nicht: %dx%d -> %dx%d", inW, inH, outW, outH)
                      return nil
                  }
                  // Sicherung gegen schwarze Bilder: wenn das Netz ein (fast) schwarzes
                  // Bild liefert, wird es verworfen und das Original gezeigt. Kostet nur
                  // ein paar Mikrosekunden (Stichprobe von Punkten, kein Vollbild).
                  let outLuma = meanLuma(outBuf)
                  if outLuma < 3.0 {
                      UserDefaults.standard.set("Ausgabe schwarz - verworfen", forKey: "pxNeuralMsg")
                      return nil
                  }
                  let ms = (CACurrentMediaTime() - t0) * 1000.0
                  lastMs = ms
                  avgMs = avgMs == 0 ? ms : (avgMs * 0.9 + ms * 0.1)
                  ranCount += 1
                  // Schutz gegen Ruckeln: wenn es dauerhaft ueber 13 ms liegt, kurz pausieren.
                  if avgMs > 40.0 {
                      pauseUntil = now + 2.0
                      os_log(.default, log: videoViewLog, "[PXNeural] zu langsam (%.1f ms) - pausiert", avgMs)
                  }
                  return outBuf
              }

              /// Restzeit der Schonpause in Sekunden (fuer /state).
              func pauseLeft() -> Double {
                  max(0, pauseUntil - CACurrentMediaTime())
              }

              // MARK: - Szenenhelligkeit

              /// Mittlere Helligkeit direkt aus dem dekodierten Bild (Y-Ebene),
              /// ohne Umweg ueber Core Image. Wird fuer den Schwellwert gebraucht.
              static func lumaMean(_ pb: CVPixelBuffer) -> Double? {
                  CVPixelBufferLockBaseAddress(pb, .readOnly)
                  defer { CVPixelBufferUnlockBaseAddress(pb, .readOnly) }
                  let fmt = CVPixelBufferGetPixelFormatType(pb)
                  if fmt == kCVPixelFormatType_420YpCbCr8BiPlanarVideoRange ||
                     fmt == kCVPixelFormatType_420YpCbCr8BiPlanarFullRange {
                      guard let base = CVPixelBufferGetBaseAddressOfPlane(pb, 0) else { return nil }
                      let w = CVPixelBufferGetWidthOfPlane(pb, 0)
                      let h = CVPixelBufferGetHeightOfPlane(pb, 0)
                      let bpr = CVPixelBufferGetBytesPerRowOfPlane(pb, 0)
                      let p = base.assumingMemoryBound(to: UInt8.self)
                      var sum = 0.0; var n = 0
                      var y = 0
                      while y < h {
                          var x = 0
                          while x < w {
                              sum += Double(p[y * bpr + x]); n += 1; x += 16
                          }
                          y += 16
                      }
                      guard n > 0 else { return nil }
                      let full = (fmt == kCVPixelFormatType_420YpCbCr8BiPlanarFullRange)
                      let v = sum / Double(n) / 255.0
                      return full ? v : max(0.0, min(1.0, (v - 16.0/255.0) / (219.0/255.0)))
                  }
                  if fmt == kCVPixelFormatType_32BGRA {
                      guard let base = CVPixelBufferGetBaseAddress(pb) else { return nil }
                      let w = CVPixelBufferGetWidth(pb), h = CVPixelBufferGetHeight(pb)
                      let bpr = CVPixelBufferGetBytesPerRow(pb)
                      let p = base.assumingMemoryBound(to: UInt8.self)
                      var sum = 0.0; var n = 0
                      var y = 0
                      while y < h {
                          var x = 0
                          while x < w {
                              let i = y * bpr + x * 4
                              sum += 0.114 * Double(p[i]) + 0.587 * Double(p[i+1]) + 0.299 * Double(p[i+2])
                              n += 1; x += 16
                          }
                          y += 16
                      }
                      return n > 0 ? sum / Double(n) / 255.0 : nil
                  }
                  return nil
              }
          }

          // MARK: - KI-Upscaler (Option, Standard: aus)
          /// Rechnet 1920x1080 auf 3840x2160 hoch. Kleines Netz (8.796 Gewichte),
          /// auf den eigenen Aufnahmen trainiert. Danach skaliert der normale Weg
          /// von 2160p auf die Panelbreite -- das ist nur noch ein kleiner Schritt,
          /// deshalb bleiben die Kanten scharf.
          final class PXAiUpscale {

              static let shared = PXAiUpscale()

              private var model: MLModel?
              private var vnModel: VNCoreMLModel?
              private var request: VNCoreMLRequest?
              private var tried = false
              private var loadedUnits = -1
              private var loadedMode = -1
              private let lock = NSLock()

              private(set) var avgMs: Double = 0
              private(set) var convMs: Double = 0
              private(set) var netMs: Double = 0
              private(set) var ranCount: Int = 0
              private(set) var msg: String = ""

              /// 0 = alles (ANE/GPU/CPU), 1 = nur GPU+CPU, 2 = nur CPU.
              /// Das Netz kann auf dem einen oder anderen Weg deutlich schneller sein --
              /// welcher, sagt die Messung, nicht die Annahme.
              private var unitsName: String {
                  switch UserDefaults.standard.integer(forKey: "pxSharpAiUnits") {
                  case 1: return "GPU"
                  case 2: return "CPU"
                  default: return "ANE"
                  }
              }

              /// 0 = 2x-Netz (1080p -> 2160p), 1 = Detail-Netz 1:1 (1080p -> 1080p),
              /// 2 = Detail-Netz 1:1 schlank (Tiefenfaltung, 2,7x weniger Rechnung).
              private var mode: Int { UserDefaults.standard.integer(forKey: "pxSharpAiMode") }
              private var modelName: String {
                  switch mode {
                  case 1: return "pxup1x"
                  case 2: return "pxup1xdw"
                  default: return "pxup"
                  }
              }
              private var outW: Int { mode == 0 ? 3840 : 1920 }
              private var outH: Int { mode == 0 ? 2160 : 1080 }

              func ensureLoaded() -> Bool {
                  lock.lock(); defer { lock.unlock() }
                  let want = UserDefaults.standard.integer(forKey: "pxSharpAiUnits")
                  let wantMode = UserDefaults.standard.integer(forKey: "pxSharpAiMode")
                  if tried && loadedUnits == want && loadedMode == wantMode { return request != nil }
                  if tried {
                      model = nil; vnModel = nil; request = nil
                      loadedUnits = -1; loadedMode = -1
                      outBuffers = []
                      msg = "lade neu"
                  }
                  guard let url = Bundle.main.url(forResource: modelName, withExtension: "mlmodelc") else {
                      tried = true
                      msg = "\(modelName) fehlt im Bundle"
                      return false
                  }
                  tried = true
                  do {
                      let cfg = MLModelConfiguration()
                      cfg.computeUnits = want == 1 ? .cpuAndGPU : (want == 2 ? .cpuOnly : .all)
                      let ml = try MLModel(contentsOf: url, configuration: cfg)
                      let vn = try VNCoreMLModel(for: ml)
                      let req = VNCoreMLRequest(model: vn)
                      req.imageCropAndScaleOption = .scaleFill
                      model = ml
                      vnModel = vn
                      request = req
                      loadedUnits = want
                      loadedMode = wantMode
                      avgMs = 0; netMs = 0; convMs = 0; ranCount = 0
                      msg = "\(modelName) geladen (\(unitsName))"
                      return true
                  } catch {
                      msg = "Laden fehlgeschlagen"
                      os_log(.error, log: videoViewLog, "[PXUp] Laden fehlgeschlagen: %{public}s", "\(error)")
                      return false
                  }
              }

              /// Sehr schnelle Helligkeitsprobe (Raster). Erkennt ein schwarzes Ergebnis.
              private func meanLuma(_ pb: CVPixelBuffer) -> Double {
                  let fmt = CVPixelBufferGetPixelFormatType(pb)
                  guard fmt == kCVPixelFormatType_32BGRA || fmt == kCVPixelFormatType_32ARGB else { return 128.0 }
                  CVPixelBufferLockBaseAddress(pb, .readOnly)
                  defer { CVPixelBufferUnlockBaseAddress(pb, .readOnly) }
                  guard let base = CVPixelBufferGetBaseAddress(pb) else { return 128.0 }
                  let w = CVPixelBufferGetWidth(pb), h = CVPixelBufferGetHeight(pb)
                  let bpr = CVPixelBufferGetBytesPerRow(pb)
                  let bytes = base.assumingMemoryBound(to: UInt8.self)
                  var sum = 0.0, n = 0.0
                  let stepX = max(1, w / 32), stepY = max(1, h / 32)
                  var y = 0
                  while y < h {
                      var x = 0
                      while x < w {
                          let p = bytes + y * bpr + x * 4
                          sum += 0.114 * Double(p[0]) + 0.587 * Double(p[1]) + 0.299 * Double(p[2])
                          n += 1
                          x += stepX
                      }
                      y += stepY
                  }
                  return n > 0 ? sum / n : 128.0
              }

              /// YUV -> 32BGRA (das Format, das Core ML als Bildeingang nimmt).
              private var convContext: CIContext?
              private var convBuffer: CVPixelBuffer?
              private func bgra(_ pb: CVPixelBuffer) -> CVPixelBuffer? {
                  let w = CVPixelBufferGetWidth(pb), h = CVPixelBufferGetHeight(pb)
                  if convContext == nil {
                      convContext = CIContext(options: [.cacheIntermediates: false])
                  }
                  if convBuffer == nil || CVPixelBufferGetWidth(convBuffer!) != w || CVPixelBufferGetHeight(convBuffer!) != h {
                      var out: CVPixelBuffer?
                      let attrs: [String: Any] = [
                          kCVPixelBufferIOSurfacePropertiesKey as String: [:] as [String: Any]
                      ]
                      CVPixelBufferCreate(kCFAllocatorDefault, w, h, kCVPixelFormatType_32BGRA,
                                          attrs as CFDictionary, &out)
                      convBuffer = out
                  }
                  guard let dst = convBuffer, let ctx = convContext else { return nil }
                  ctx.render(CIImage(cvPixelBuffer: pb), to: dst)
                  return dst
              }

              /// Notbremse ueber ein Zeitfenster: zaehlt nur die letzten zwei Sekunden.
              /// Dadurch laesst sich der Schalter danach wieder einschalten -- vorher
              /// blockierte der Zaehler jede weitere Aktivierung.
              private var winStart: CFTimeInterval = 0
              private var winCount = 0
              private var winSum = 0.0

              private func brakeIfSlow(_ ms: Double) -> Bool {
                  let now = CACurrentMediaTime()
                  if now - winStart > 2.0 {
                      winStart = now
                      winCount = 0
                      winSum = 0
                  }
                  winCount += 1
                  winSum += ms
                  guard winCount >= 20 else { return false }
                  let avg = winSum / Double(winCount)
                  // Grenze einstellbar: 45 ms sind bei 30-fps-Spielen noch brauchbar,
                  // 34 ms war zu streng (der Schalter sprang sofort zurueck).
                  let limit = (UserDefaults.standard.object(forKey: "pxSharpAiBrakeMs") as? Double) ?? 45.0
                  guard avg > limit else { return false }
                  winStart = now
                  winCount = 0
                  winSum = 0
                  avgMs = avg
                  UserDefaults.standard.set(false, forKey: "pxSharpAiUpscale")
                  msg = String(format: "zu langsam (%.0f ms), aus", avg)
                  return true
              }

              /// Zwei fertige Zielpuffer (33 MB), die immer wiederverwendet werden.
              /// Vorher bekam JEDES Bild einen neuen Puffer vom System -- 60-mal pro
              /// Sekunde 33 MB anfordern und wegwerfen ist reine Verschwendung.
              private var outBuffers: [CVPixelBuffer] = []
              private var outIndex = 0
              private func outputBuffer() -> CVPixelBuffer? {
                  if outBuffers.isEmpty || CVPixelBufferGetWidth(outBuffers[0]) != outW {
                      outBuffers = []
                      for _ in 0..<2 {
                          var pb: CVPixelBuffer?
                          let attrs: [String: Any] = [
                              kCVPixelBufferIOSurfacePropertiesKey as String: [:] as [String: Any]
                          ]
                          CVPixelBufferCreate(kCFAllocatorDefault, outW, outH, kCVPixelFormatType_32BGRA,
                                              attrs as CFDictionary, &pb)
                          if let pb = pb { outBuffers.append(pb) }
                      }
                  }
                  guard !outBuffers.isEmpty else { return nil }
                  outIndex = (outIndex + 1) % outBuffers.count
                  return outBuffers[outIndex]
              }

              /// Gibt das hochgerechnete Bild zurueck, oder nil (dann bleibt der alte Weg).
              func upscale(_ pb: CVPixelBuffer) -> CVPixelBuffer? {
                  guard ensureLoaded() else { return nil }
                  let w = CVPixelBufferGetWidth(pb), h = CVPixelBufferGetHeight(pb)
                  guard w == 1920, h == 1080 else { return nil }
                  let t0 = CACurrentMediaTime()
                  var out: CVPixelBuffer?
                  var path = "-"
                  // 1. Direkter Weg: schneller, weil Vision nichts umpacken muss.
                  if let model = model {
                      let fmt = CVPixelBufferGetPixelFormatType(pb)
                      let src = (fmt == kCVPixelFormatType_32BGRA) ? pb : (bgra(pb) ?? pb)
                      if fmt != kCVPixelFormatType_32BGRA {
                          let c = (CACurrentMediaTime() - t0) * 1000.0
                          convMs = convMs == 0 ? c : (convMs * 0.8 + c * 0.2)
                      }
                      let tp = CACurrentMediaTime()
                      if CVPixelBufferGetPixelFormatType(src) == kCVPixelFormatType_32BGRA,
                         let provider = try? MLDictionaryFeatureProvider(dictionary: [
                             "input": MLFeatureValue(pixelBuffer: src)
                         ]) {
                          // Erst in unseren eigenen Puffer schreiben lassen (keine Allokation).
                          if let dst = outputBuffer() {
                              let opts = MLPredictionOptions()
                              opts.outputBackings = ["output": dst]
                              if (try? model.prediction(from: provider, options: opts)) != nil {
                                  out = dst
                                  path = "direkt/puffer"
                              }
                          }
                          if out == nil, let result = try? model.prediction(from: provider) {
                              out = result.featureValue(for: "output")?.imageBufferValue
                              path = "direkt"
                          }
                      }
                      let n = (CACurrentMediaTime() - tp) * 1000.0
                      netMs = netMs == 0 ? n : (netMs * 0.8 + n * 0.2)
                  }
                  // 2. Vision als Rueckfall.
                  if out == nil, let req = request {
                      let handler = VNImageRequestHandler(cvPixelBuffer: pb, options: [:])
                      if (try? handler.perform([req])) != nil,
                         let obs = req.results?.first as? VNPixelBufferObservation {
                          out = obs.pixelBuffer
                          path = "Vision"
                      }
                  }
                  let ms = (CACurrentMediaTime() - t0) * 1000.0
                  avgMs = avgMs == 0 ? ms : (avgMs * 0.9 + ms * 0.1)
                  guard let out = out else {
                      msg = "kein Ergebnis (\(path))"
                      return nil
                  }
                  let ow = CVPixelBufferGetWidth(out), oh = CVPixelBufferGetHeight(out)
                  guard ow == outW, oh == outH else {
                      msg = "falsche Groesse \(ow)x\(oh) (erwartet \(outW)x\(outH))"
                      return nil
                  }
                  ranCount += 1
                  // Sicherung: ein schwarzes oder weisses Ergebnis wird verworfen.
                  let luma = meanLuma(out)
                  if luma < 4.0 || luma > 251.0 {
                      msg = String(format: "%@ verworfen (%.1f, %.0f ms)", path, luma, ms)
                      _ = brakeIfSlow(ms)
                      return nil
                  }
                  msg = String(format: "%@ %@/%@ ok (%.1f)", modelName, unitsName, path, luma)
                  if brakeIfSlow(ms) { return nil }
                  return out
              }
          }
          // MARK: - Luma-Detailnetz (nur Helligkeit, ohne Farbumwandlung)
          /// Das Netz rechnet NUR auf der Y-Ebene des Videobuffers. Damit entfaellt die
          /// Umwandlung YUV -> BGRA (gemessen 3-4 ms) komplett: wir kopieren die
          /// Helligkeitsebene heraus, rechnen sie durch das Netz und schreiben sie in
          /// einen neuen 4:2:0-Puffer, dessen Farbebenen unveraendert uebernommen werden.
          /// Ergebnis: +3 dB Detail bei 1 Kanal statt 3 -- rund ein Drittel der Rechnung.
          final class PXLumaDetail {

              static let shared = PXLumaDetail()

              private var model: MLModel?
              private var tried = false
              private let lock = NSLock()

              private var yIn: CVPixelBuffer?
              private var yOut: CVPixelBuffer?
              private var out420: CVPixelBuffer?
              private var outW = 0
              private var outH = 0

              private(set) var avgMs: Double = 0
              private(set) var ranCount: Int = 0
              private(set) var msg: String = ""

              func ensureLoaded() -> Bool {
                  lock.lock(); defer { lock.unlock() }
                  if tried { return model != nil }
                  tried = true
                  guard let url = Bundle.main.url(forResource: "pxluma", withExtension: "mlmodelc") else {
                      msg = "pxluma fehlt"
                      return false
                  }
                  do {
                      let cfg = MLModelConfiguration()
                      cfg.computeUnits = .all
                      model = try MLModel(contentsOf: url, configuration: cfg)
                      msg = "geladen"
                      return true
                  } catch {
                      msg = "Laden fehlgeschlagen"
                      return false
                  }
              }

              private func makeBuffer(_ w: Int, _ h: Int, _ fmt: OSType) -> CVPixelBuffer? {
                  var pb: CVPixelBuffer?
                  let attrs: [String: Any] = [kCVPixelBufferIOSurfacePropertiesKey as String: [:] as [String: Any]]
                  CVPixelBufferCreate(kCFAllocatorDefault, w, h, fmt, attrs as CFDictionary, &pb)
                  return pb
              }

              private func copyPlane(_ src: CVPixelBuffer, _ sPlane: Int, _ dst: CVPixelBuffer, _ dPlane: Int) {
                  CVPixelBufferLockBaseAddress(src, .readOnly)
                  CVPixelBufferLockBaseAddress(dst, [])
                  defer {
                      CVPixelBufferUnlockBaseAddress(dst, [])
                      CVPixelBufferUnlockBaseAddress(src, .readOnly)
                  }
                  guard let s = CVPixelBufferGetBaseAddressOfPlane(src, sPlane),
                        let d = CVPixelBufferGetBaseAddressOfPlane(dst, dPlane) else { return }
                  let sh = CVPixelBufferGetHeightOfPlane(src, sPlane)
                  let sbpr = CVPixelBufferGetBytesPerRowOfPlane(src, sPlane)
                  let dbpr = CVPixelBufferGetBytesPerRowOfPlane(dst, dPlane)
                  let row = min(sbpr, dbpr)
                  for yy in 0..<sh {
                      memcpy(d.advanced(by: yy * dbpr), s.advanced(by: yy * sbpr), row)
                  }
              }

              /// Gibt einen neuen 4:2:0-Puffer mit entrauschter/geschaerfter Helligkeit zurueck.
              func process(_ pb: CVPixelBuffer) -> CVPixelBuffer? {
                  guard ensureLoaded(), let model = model else { return nil }
                  let fmt = CVPixelBufferGetPixelFormatType(pb)
                  guard fmt == kCVPixelFormatType_420YpCbCr8BiPlanarVideoRange ||
                        fmt == kCVPixelFormatType_420YpCbCr8BiPlanarFullRange else { return nil }
                  let w = CVPixelBufferGetWidth(pb), h = CVPixelBufferGetHeight(pb)
                  guard w == 1920, h == 1080 else { return nil }

                  if yIn == nil || outW != w || outH != h {
                      yIn = makeBuffer(w, h, kCVPixelFormatType_OneComponent8)
                      yOut = makeBuffer(w, h, kCVPixelFormatType_OneComponent8)
                      out420 = makeBuffer(w, h, fmt)
                      outW = w; outH = h
                  }
                  guard let src8 = yIn, let dst8 = yOut, let full = out420 else { return nil }

                  let t0 = CACurrentMediaTime()
                  copyPlane(pb, 0, src8, 0)
                  guard let provider = try? MLDictionaryFeatureProvider(dictionary: [
                            "input": MLFeatureValue(pixelBuffer: src8)
                        ]),
                        let res = try? model.prediction(from: provider),
                        let out = res.featureValue(for: "output")?.imageBufferValue else {
                      msg = "kein Ergebnis"
                      return nil
                  }
                  // Helligkeit zurueckschreiben, Farbe unveraendert uebernehmen.
                  copyPlane(out, 0, dst8, 0)
                  copyPlane(dst8, 0, full, 0)
                  copyPlane(pb, 1, full, 1)
                  // Farbmetadaten (Matrix, Range) mitnehmen, sonst kippen die Farben.
                  if let atts = CVBufferCopyAttachments(pb, .shouldPropagate) {
                      CVBufferSetAttachments(full, atts, .shouldPropagate)
                  }
                  let ms = (CACurrentMediaTime() - t0) * 1000.0
                  avgMs = avgMs == 0 ? ms : (avgMs * 0.9 + ms * 0.1)
                  ranCount += 1
                  msg = "ok"
                  return full
              }
          }
          // MARK: - Temporale Akkumulation (Mehrbild-Schaerfung)
          /// Nutzt, dass sich die Kamera zwischen zwei Bildern um Bruchteile eines
          /// Pixels bewegt: dieselbe Kante liegt in jedem Bild auf einer anderen
          /// Subpixel-Position. Mehrere ausgerichtete Bilder ergeben echte zusaetzliche
          /// Abtastpunkte -- kein Raten, keine Halos.
          ///
          /// Ohne Motion-Vektoren (die haben wir nicht) wird die Verschiebung global
          /// geschaetzt: Projektionen der Helligkeit (Spalten-/Zeilensummen) auf 1/8
          /// Aufloesung, dann Kreuzkorrelation. Kostet ~0,3 ms.
          ///
          /// Gegen Ghosting: das Ergebnis wird auf den Wertebereich der 3x3-Nachbarschaft
          /// des aktuellen Bildes geklemmt (Neighbourhood Clamping, Standard bei TAAU).
          final class PXAccumulate {

              static let shared = PXAccumulate()

              private(set) var shiftX: Double = 0
              private(set) var shiftY: Double = 0
              private(set) var costMs: Double = 0
              private(set) var msg: String = ""

              private var prevCols: [Double] = []
              private var prevRows: [Double] = []

              /// Schaetzt die globale Verschiebung zum vorherigen Bild (in Quellpixeln).
              func estimate(_ pb: CVPixelBuffer) {
                  let fmt = CVPixelBufferGetPixelFormatType(pb)
                  guard fmt == kCVPixelFormatType_420YpCbCr8BiPlanarVideoRange ||
                        fmt == kCVPixelFormatType_420YpCbCr8BiPlanarFullRange else { return }
                  let t0 = CACurrentMediaTime()
                  CVPixelBufferLockBaseAddress(pb, .readOnly)
                  defer { CVPixelBufferUnlockBaseAddress(pb, .readOnly) }
                  guard let base = CVPixelBufferGetBaseAddressOfPlane(pb, 0) else { return }
                  let w = CVPixelBufferGetWidthOfPlane(pb, 0)
                  let h = CVPixelBufferGetHeightOfPlane(pb, 0)
                  let bpr = CVPixelBufferGetBytesPerRowOfPlane(pb, 0)
                  guard w > 64, h > 64 else { return }
                  let step = 8
                  let gw = w / step, gh = h / step
                  var cols = [Double](repeating: 0, count: gw)
                  var rows = [Double](repeating: 0, count: gh)
                  let p = base.assumingMemoryBound(to: UInt8.self)
                  var y = 0
                  while y < h {
                      let row = y * bpr
                      var x = 0
                      while x < w {
                          let v = Double(p[row + x])
                          cols[x / step] += v
                          rows[y / step] += v
                          x += step
                      }
                      y += step
                  }
                  if prevCols.count == gw && prevRows.count == gh {
                      shiftX = Double(bestShift(cols, prevCols)) * Double(step)
                      shiftY = Double(bestShift(rows, prevRows)) * Double(step)
                  }
                  prevCols = cols; prevRows = rows
                  costMs = (CACurrentMediaTime() - t0) * 1000.0
                  msg = String(format: "dx %.0f dy %.0f", shiftX, shiftY)
              }

              /// Sucht die Verschiebung mit der kleinsten Summe absoluter Differenzen.
              private func bestShift(_ a: [Double], _ b: [Double]) -> Int {
                  let maxS = 6
                  var best = 0
                  var bestCost = Double.greatestFiniteMagnitude
                  for s in -maxS...maxS {
                      var cost = 0.0, n = 0
                      var i = max(0, -s)
                      let end = min(a.count, b.count - s)
                      while i < end {
                          cost += abs(a[i] - b[i + s]); n += 1; i += 1
                      }
                      if n > 16 {
                          cost /= Double(n)
                          if cost < bestCost { bestCost = cost; best = s }
                      }
                  }
                  return best
              }
          }
          SWIFT_SOURCE_EOF

          # --- Decoder: Autorelease-Pool pro Frame (Speicherleck) -------------------
          cat > ios/Pylux/Bridge/VideoDecoder.m <<'VDEC_SOURCE_EOF'
          // SPDX-License-Identifier: LicenseRef-AGPL-3.0-only-OpenSSL
          // VideoToolbox-based H.264/HEVC decoder

          #import "VideoDecoder.h"
          #import <VideoToolbox/VideoToolbox.h>
          #import <AVFoundation/AVFoundation.h>
          #import <CoreMedia/CoreMedia.h>
          #import <os/log.h>

          static os_log_t g_vdec_log;

          @interface PyluxVideoDecoder ()
          @property (nonatomic, assign) VTDecompressionSessionRef session;
          @property (nonatomic, assign) CMVideoFormatDescriptionRef formatDesc;
          @property (nonatomic, assign) uint64_t presentationTimeStamp;
          @property (nonatomic, strong) AVSampleBufferDisplayLayer *displayLayer;
          @property (nonatomic, assign) uint64_t framesDecoded;
          @property (nonatomic, assign) BOOL loggedFirstFrame;
          @end

          static void outputCallback(void *decompressionOutputRefCon,
                                     void *sourceFrameRefCon,
                                     OSStatus status,
                                     VTDecodeInfoFlags infoFlags,
                                     CVImageBufferRef imageBuffer,
                                     CMTime presentationTimeStamp,
                                     CMTime presentationDuration) {
              @autoreleasepool {
              (void)sourceFrameRefCon;
              (void)infoFlags;
              (void)presentationDuration;
              PyluxVideoDecoder *dec = (__bridge PyluxVideoDecoder *)decompressionOutputRefCon;
              if (status != noErr || !imageBuffer) {
          #if DEBUG
                  os_log_with_type(g_vdec_log, OS_LOG_TYPE_ERROR, "[outputCallback] VT decode status %d", (int)status);
          #else
                  /* kVTVideoDecoderBadDataErr (-12909): common when upstream drops/corrupts frames (FEC gaps). */
                  if (status != -12909)
                      os_log_with_type(g_vdec_log, OS_LOG_TYPE_ERROR, "[outputCallback] VT decode status %d", (int)status);
          #endif
                  return;
              }
              dec.framesDecoded++;
              if (!dec.loggedFirstFrame) {
                  dec.loggedFirstFrame = YES;
                  os_log(g_vdec_log, "[outputCallback] First decoded frame (status=%d)", (int)status);
              } else if (dec.framesDecoded % 300 == 0) {
                  os_log(g_vdec_log, "[outputCallback] Decoded frame %llu", (unsigned long long)dec.framesDecoded);
              }
              if (dec.frameCallback) {
                  dec.frameCallback(imageBuffer, presentationTimeStamp);
              }
              __strong AVSampleBufferDisplayLayer *layer = dec.displayLayer;
              if (!layer && dec.framesDecoded <= 3) {
                  os_log_with_type(g_vdec_log, OS_LOG_TYPE_DEFAULT, "[outputCallback] No displayLayer attached, frame %llu", (unsigned long long)dec.framesDecoded);
              }
              if (layer) {
                  CMVideoFormatDescriptionRef fmtDesc = NULL;
                  OSStatus err = CMVideoFormatDescriptionCreateForImageBuffer(kCFAllocatorDefault, imageBuffer, &fmtDesc);
                  if (err == noErr && fmtDesc) {
                      CMSampleBufferRef sbuf = NULL;
                      // Order: duration, presentationTimeStamp, decodeTimeStamp (not PTS first).
                      CMTime pts = presentationTimeStamp;
                      if (!CMTIME_IS_VALID(pts) || !CMTIME_IS_NUMERIC(pts)) {
                          pts = CMTimeMake((int64_t)dec.framesDecoded, 90000);
                      }
                      CMSampleTimingInfo timing = {
                          .duration = kCMTimeInvalid,
                          .presentationTimeStamp = pts,
                          .decodeTimeStamp = kCMTimeInvalid
                      };
                      err = CMSampleBufferCreateForImageBuffer(kCFAllocatorDefault, imageBuffer, true, NULL, NULL, fmtDesc, &timing, &sbuf);
                      CFRelease(fmtDesc);
                      if (err == noErr && sbuf) {
                          CMSetAttachment(sbuf, kCMSampleAttachmentKey_DisplayImmediately, kCFBooleanTrue, kCMAttachmentMode_ShouldNotPropagate);
                          __strong AVSampleBufferDisplayLayer *layerStrong = layer;
                          uint64_t frameNum = dec.framesDecoded;
                          dispatch_async(dispatch_get_main_queue(), ^{
                              CGRect b = layerStrong.bounds;
                              if (frameNum <= 2) {
                                  os_log(g_vdec_log, "[outputCallback] enqueue frame %llu bounds=%.0fx%.0f", (unsigned long long)frameNum, b.size.width, b.size.height);
                              }
                              [layerStrong enqueueSampleBuffer:sbuf];
                              CFRelease(sbuf);
                          });
                      }
                  }
              }
              }  // @autoreleasepool
          }

          @implementation PyluxVideoDecoder

          + (void)initialize {
              if (self == [PyluxVideoDecoder class]) {
                  g_vdec_log = os_log_create("com.pylux.stream", "VideoDecoder");
              }
          }

          - (instancetype)initWithWidth:(int32_t)width height:(int32_t)height codec:(PyluxVideoCodec)codec {
              self = [super init];
              if (self) {
                  _width = width;
                  _height = height;
                  _codec = codec;
                  _presentationTimeStamp = 0;
                  _framesDecoded = 0;
                  _loggedFirstFrame = NO;
                  os_log(g_vdec_log, "[init] VideoDecoder %dx%d codec=%{public}@", width, height, codec == PyluxVideoCodecH265 ? @"HEVC" : @"H264");
              }
              return self;
          }

          - (void)dealloc {
              [self reset];
          }

          static BOOL findNextNAL(const uint8_t *data, size_t size, size_t *startOut, size_t *lenOut) {
              // A NAL begins after a 3-byte (00 00 01) or 4-byte (00 00 00 01) start code
              // and ends at the next start code OF EITHER STYLE (or the buffer end).
              // Streams freely mix styles within one access unit — PSNOW PS3 frames carry
              // slice 1 behind a 4-byte code and slice 2 behind a 3-byte code. Scanning
              // only for the same style (as this function once did) merges the slices into
              // one corrupt "NAL" with an embedded start code, which hardware VideoToolbox
              // rejects (-12909) for every frame.
              size_t i = 0;
              while (i + 3 <= size) {
                  size_t nalStart;
                  if (data[i] == 0 && data[i+1] == 0 && data[i+2] == 1)
                      nalStart = i + 3;
                  else if (i + 4 <= size && data[i] == 0 && data[i+1] == 0 && data[i+2] == 0 && data[i+3] == 1)
                      nalStart = i + 4;
                  else {
                      i++;
                      continue;
                  }
                  if (nalStart >= size) return NO;
                  size_t j = nalStart;
                  while (j + 3 <= size) {
                      if (data[j] == 0 && data[j+1] == 0
                          && (data[j+2] == 1 || (j + 4 <= size && data[j+2] == 0 && data[j+3] == 1)))
                          break;
                      j++;
                  }
                  size_t nalEnd = (j + 3 <= size) ? j : size;
                  if (nalEnd == nalStart) {
                      // Adjacent start codes (zero-length NAL, only in malformed streams):
                      // skip past it and keep scanning instead of dropping the rest of the
                      // buffer's NALs.
                      i = nalStart;
                      continue;
                  }
                  *startOut = nalStart;
                  *lenOut = nalEnd - nalStart;
                  return YES;
              }
              return NO;
          }

          static uint8_t h264NALType(const uint8_t *nal, size_t len) {
              if (len < 1) return 0;
              return nal[0] & 0x1f;
          }

          static uint8_t h265NALType(const uint8_t *nal, size_t len) {
              if (len < 2) return 0;
              return (nal[0] >> 1) & 0x3f;
          }

          - (BOOL)updateFormatFromAnnexB:(const uint8_t *)buf size:(size_t)bufSize {
              const uint8_t *params[3] = { NULL, NULL, NULL }; // H265: VPS/SPS/PPS, H264: SPS/PPS
              size_t paramSizes[3] = { 0, 0, 0 };
              size_t paramCount = 0;
              BOOL isH265 = (self.codec == PyluxVideoCodecH265);
              size_t off = 0;
              size_t start, len;
              while (findNextNAL(buf + off, bufSize - off, &start, &len)) {
                  const uint8_t *nal = buf + off + start;
                  uint8_t type = isH265 ? h265NALType(nal, len) : h264NALType(nal, len);
                  if (isH265) {
                      if (type == 32) { params[0] = nal; paramSizes[0] = len; } // VPS
                      else if (type == 33) { params[1] = nal; paramSizes[1] = len; } // SPS
                      else if (type == 34) { params[2] = nal; paramSizes[2] = len; } // PPS
                      if (params[1] && params[2]) {
                          // Prefer VPS+SPS+PPS when available, but still accept SPS+PPS only.
                          paramCount = params[0] ? 3 : 2;
                          break;
                      }
                  } else {
                      if (type == 7) { params[0] = nal; paramSizes[0] = len; } // SPS
                      else if (type == 8 && params[0]) { params[1] = nal; paramSizes[1] = len; paramCount = 2; break; } // PPS
                  }
                  off += start + len;
              }
              if (paramCount < 2 && !isH265) {
                  if (params[0]) { paramCount = 1; params[1] = NULL; paramSizes[1] = 0; }
              }
              if (paramCount < 1) {
                  os_log_with_type(g_vdec_log, OS_LOG_TYPE_ERROR, "[updateFormatFromAnnexB] No param sets found");
                  return NO;
              }
              CMVideoFormatDescriptionRef newFmt = NULL;
              if (isH265) {
                  if (paramCount < 2) return NO;
                  const uint8_t *paramSetPointers[3] = { 0 };
                  size_t paramSetSizes[3] = { 0 };
                  if (paramCount == 3) {
                      // VPS + SPS + PPS
                      paramSetPointers[0] = params[0];
                      paramSetPointers[1] = params[1];
                      paramSetPointers[2] = params[2];
                      paramSetSizes[0] = paramSizes[0];
                      paramSetSizes[1] = paramSizes[1];
                      paramSetSizes[2] = paramSizes[2];
                  } else {
                      // SPS + PPS fallback
                      paramSetPointers[0] = params[1];
                      paramSetPointers[1] = params[2];
                      paramSetSizes[0] = paramSizes[1];
                      paramSetSizes[1] = paramSizes[2];
                  }
                  OSStatus err = CMVideoFormatDescriptionCreateFromHEVCParameterSets(kCFAllocatorDefault, paramCount, paramSetPointers, paramSetSizes, 4, NULL, &newFmt);
                  if (err != noErr) return NO;
              } else {
                  OSStatus err = CMVideoFormatDescriptionCreateFromH264ParameterSets(kCFAllocatorDefault, paramCount, params, paramSizes, 4, &newFmt);
                  if (err != noErr) return NO;
              }
              if (self.formatDesc) CFRelease(self.formatDesc);
              self.formatDesc = newFmt;
              os_log(g_vdec_log, "[updateFormatFromAnnexB] Format created paramCount=%zu %{public}s", (size_t)paramCount, isH265 ? "HEVC" : "H264");
              [self createSession];
              return YES;
          }

          - (void)createSession {
              if (self.session) {
                  os_log(g_vdec_log, "[createSession] invalidating previous session");
                  VTDecompressionSessionInvalidate(self.session);
                  CFRelease(self.session);
                  self.session = NULL;
              }
              self.presentationTimeStamp = 0;
              if (!self.formatDesc) return;
              os_log(g_vdec_log, "[createSession] VTDecompressionSessionCreate");
              NSDictionary *attrs = @{
                  (id)kCVPixelBufferPixelFormatTypeKey: @(kCVPixelFormatType_420YpCbCr8BiPlanarVideoRange),
                  (id)kCVPixelBufferIOSurfacePropertiesKey: @{}
              };
              VTDecompressionOutputCallbackRecord cb = { outputCallback, (__bridge void *)self };
              OSStatus err = VTDecompressionSessionCreate(kCFAllocatorDefault, self.formatDesc, NULL, (__bridge CFDictionaryRef)attrs, &cb, &_session);
              os_log(g_vdec_log, "[createSession] err=%d session=%p", (int)err, (void *)self.session);
              if (err != noErr) {
                  os_log_with_type(g_vdec_log, OS_LOG_TYPE_ERROR, "[createSession] VTDecompressionSessionCreate FAILED %d", (int)err);
              }
          }

          - (void)setDisplayLayer:(AVSampleBufferDisplayLayer *)layer {
              _displayLayer = layer;
              if (layer) {
                  CGRect b = layer.bounds;
                  os_log(g_vdec_log, "[setDisplayLayer] bounds=%.0fx%.0f superlayer=%d", b.size.width, b.size.height, layer.superlayer ? 1 : 0);
              } else {
                  os_log(g_vdec_log, "[setDisplayLayer] cleared");
              }
          }

          - (void)reset {
              if (self.session) {
                  VTDecompressionSessionInvalidate(self.session);
                  CFRelease(self.session);
                  _session = NULL;
              }
              if (self.formatDesc) {
                  CFRelease(self.formatDesc);
                  _formatDesc = NULL;
              }
          }

          - (BOOL)feedSample:(const uint8_t *)buf size:(size_t)bufSize framesLost:(int32_t)framesLost frameRecovered:(BOOL)frameRecovered {
              static uint64_t s_callbackCount = 0;
              s_callbackCount++;
              if (s_callbackCount <= 3 || (s_callbackCount % 300 == 0)) {
                  os_log(g_vdec_log, "[feedSample] #%llu size=%zu lost=%d recovered=%{public}s", (unsigned long long)s_callbackCount, bufSize, (int)framesLost, frameRecovered ? "Y" : "N");
              }
              if (!buf || bufSize == 0) return YES;
              BOOL isH265 = (self.codec == PyluxVideoCodecH265);
              size_t off = 0;
              size_t start, len;
              BOOL hasSlice = NO;
              BOOL needsFormatUpdate = NO;  // Track if we have param NALs; update format once per buffer
              while (findNextNAL(buf + off, bufSize - off, &start, &len)) {
                  const uint8_t *nal = buf + off + start;
                  uint8_t type = isH265 ? h265NALType(nal, len) : h264NALType(nal, len);
                  if (isH265) {
                      if (type == 32 || type == 33 || type == 34) {
                          needsFormatUpdate = YES;
                      } else if (type <= 31) {
                          hasSlice = YES;
                      }
                  } else {
                      if (type == 7 || type == 8) {
                          needsFormatUpdate = YES;
                      } else if (type == 5 || type == 1) hasSlice = YES;
                  }
                  off += start + len;
              }
              if (needsFormatUpdate && [self updateFormatFromAnnexB:buf size:bufSize]) {
                  os_log(g_vdec_log, "[feedSample] format updated from param NALs");
              }
              // Header-only buffers (SPS/PPS or VPS/SPS/PPS): always acknowledge without decoding.
              if (!hasSlice) {
                  if (s_callbackCount <= 5) os_log(g_vdec_log, "[feedSample] header-only size=%zu, ack", bufSize);
                  return YES;
              }
              if (!self.formatDesc && ![self updateFormatFromAnnexB:buf size:bufSize]) {
                  os_log_with_type(g_vdec_log, OS_LOG_TYPE_ERROR,
                                   "[feedSample] No format description (codec=%{public}s, buf=%zu, lost=%d, recovered=%{public}s)",
                                   isH265 ? "H265" : "H264",
                                   bufSize,
                                   (int)framesLost,
                                   frameRecovered ? "true" : "false");
                  return NO;
              }
              if (!self.session) {
                  os_log_with_type(g_vdec_log, OS_LOG_TYPE_ERROR, "[feedSample] Decoder session not available");
                  return NO;
              }
              NSMutableData *avcc = [NSMutableData dataWithCapacity:bufSize + 256];
              off = 0;
              while (findNextNAL(buf + off, bufSize - off, &start, &len)) {
                  const uint8_t *nal = buf + off + start;
                  uint32_t lenBe = CFSwapInt32HostToBig((uint32_t)len);
                  [avcc appendBytes:&lenBe length:4];
                  [avcc appendBytes:nal length:len];
                  off += start + len;
              }
              if (avcc.length < 5) return YES;
              void *avccCopy = CFAllocatorAllocate(kCFAllocatorDefault, avcc.length, 0);
              if (!avccCopy) return YES;
              memcpy(avccCopy, avcc.bytes, avcc.length);
              CMBlockBufferRef blockBuf = NULL;
              OSStatus err = CMBlockBufferCreateWithMemoryBlock(kCFAllocatorDefault, avccCopy, avcc.length, kCFAllocatorDefault, NULL, 0, avcc.length, kCMBlockBufferAssureMemoryNowFlag, &blockBuf);
              if (err != noErr || !blockBuf) {
                  os_log_with_type(g_vdec_log, OS_LOG_TYPE_ERROR, "[feedSample] CMBlockBufferCreateWithMemoryBlock failed: %d", (int)err);
                  CFAllocatorDeallocate(kCFAllocatorDefault, avccCopy);
                  return NO;
              }
              CMSampleBufferRef sampleBuf = NULL;
              CMSampleTimingInfo timing = {
                  .duration = kCMTimeInvalid,
                  .presentationTimeStamp = CMTimeMake(self.presentationTimeStamp, 90000),
                  .decodeTimeStamp = kCMTimeInvalid
              };
              err = CMSampleBufferCreate(kCFAllocatorDefault, blockBuf, TRUE, NULL, NULL, self.formatDesc, 1, 1, &timing, 0, NULL, &sampleBuf);
              CFRelease(blockBuf);
              if (err != noErr || !sampleBuf) {
                  os_log_with_type(g_vdec_log, OS_LOG_TYPE_ERROR, "[feedSample] CMSampleBufferCreate failed: %d", (int)err);
                  return NO;
              }
              self.presentationTimeStamp++;
              VTDecodeFrameFlags flags = kVTDecodeFrame_EnableAsynchronousDecompression;
              err = VTDecompressionSessionDecodeFrame(self.session, sampleBuf, flags, NULL, NULL);
              CFRelease(sampleBuf);
              if (err != noErr) {
                  os_log_with_type(g_vdec_log, OS_LOG_TYPE_ERROR, "[feedSample] VTDecompressionSessionDecodeFrame err=%d buf=%zu lost=%d", (int)err, bufSize, (int)framesLost);
                  return NO;
              }
              if (s_callbackCount <= 5 || (self.presentationTimeStamp > 0 && self.presentationTimeStamp % 300 == 1)) {
                  os_log(g_vdec_log, "[feedSample] queued frame pts=%llu", (unsigned long long)self.presentationTimeStamp);
              }
              return YES;
          }

          @end

          bool PyluxVideoDecoderVideoSampleCallback(uint8_t *buf, size_t buf_size, int32_t frames_lost, bool frame_recovered, void *user) {
              if (!user) return true;
              @autoreleasepool {
                  PyluxVideoDecoder *dec = (__bridge PyluxVideoDecoder *)user;
                  return [dec feedSample:buf size:buf_size framesLost:frames_lost frameRecovered:frame_recovered];
              }
          }
