                      Toggle("1:1 Pixelmodus (kein Scaling)", isOn: $pixelPerfect)
                      Toggle("MetalFX Upscaling (Apple)", isOn: $metalFX)
                      Button("Maximale Quelle: 1080p · 60 fps · 50 Mbit · H.265") {
                          onMaxQuality()
                      }
                      DisclosureGroup("Was technisch möglich ist") {
                          VStack(alignment: .leading, spacing: 6) {
                              Text("Auflösung: 1080p ist das Maximum, das die PS5 über Remote Play herausgibt. 4K/120 gibt es nur am HDMI-Ausgang.")
                              Text("Framerate: 60 ist das Protokoll-Maximum. Höher wäre nur lokal interpoliert und bringt keine Information.")
                              Text("Bitrate: der echte Qualitätshebel. 50 statt 12 Mbit = weniger Blockbildung = mehr Detail, ganz ohne Schärfung.")
                              Text("Codec: H.265 packt dieselbe Bitrate effizienter als H.264. Immer H.265 wählen.")
                              Text("Schärfe ist jetzt luma-only (nur Helligkeit). Dadurch keine Farbsäume mehr — höhere Werte bleiben sauber.")
                              Text("Detail wirkt zweistufig: einmal bei 1080p vor dem Skalieren, einmal am Panel. Das ist der Unterschied zwischen „hochgerechnet“ und „detailreich“.")
                              Text("MetalFX: Apples kantenbewusste Rekonstruktion statt Lanczos — die einzige echte Auflösungserhöhung ohne Informationsverlust.")
                          }
                          .font(.caption)
                          .foregroundColor(.secondary)
                      }
                  }
                  .onAppear {
                      guard !tunedV1 else { return }
                      // Einmalige Grundoptimierung: sauberes Quellsignal VOR der Schärfung.
                      // Ohne Deblocking verstärkt jede Schärfung MPEG-Rauschen — genau das
                      // wirkt dann unnatürlich, egal wie fein der Regler arbeitet.
                      if denoise < 0.25 { denoise = 0.30 }
                      if vibrance < 0.10 { vibrance = 0.10 }
                      pacing = true
                      tunedV1 = true
                  }
              }
