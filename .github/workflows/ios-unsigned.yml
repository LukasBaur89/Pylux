                      DisclosureGroup("Was macht welcher Regler?") {
                          VStack(alignment: .leading, spacing: 6) {
                              Text("Schärfe — Kanten (1 px). Zu hoch: harte Höfe an Konturen.")
                              Text("Detail — Textur (2,5 px). Gras, Stoff, Metall. Der Regler für „materialig“.")
                              Text("Klarheit — lokaler Kontrast (8 px). Tiefe und Pop, zu hoch wirkt es künstlich.")
                              Text("Rauschfilter — glättet MPEG-Blöcke. Ab 25 % aktiv, kostet Leistung.")
                              Text("Sättigung — 50 % = neutral.")
                              Text("Kontrast — 1,00 = neutral. Darüber mehr Punch, darunter flacher.")
                              Text("Farbtemperatur — 6500 K = neutral, darunter wärmer, darüber kühler.")
                              Text("Gamma — hebt Schatten, 1,00 = neutral.")
                              Text("Schwarzwert — Offset der Schwärze, sparsam einsetzen.")
                              Text("HDR-Peak — kleiner = heller. Sagt dem System, wie hell dein Inhalt ist.")
                              Text("MetalFX — Apples Kantenrekonstruktion statt Lanczos.")
                              Text("1:1 — kein Scaling, zeigt die echte Quelle (kleiner).")
                          }
                          .font(.caption)
                          .foregroundColor(.secondary)
