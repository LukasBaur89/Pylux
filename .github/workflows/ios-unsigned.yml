                          if mode != 11 && mode != 12 {
                              Text("Eigener").tag(mode)
                          }
                      }
                      .pickerStyle(.segmented)
                      .padding(.horizontal, 18)
                      .padding(.bottom, 12)
                      .onChange(of: mode) { m in SharpnessRow.applyPreset(m) }

                      HStack(spacing: 12) {
