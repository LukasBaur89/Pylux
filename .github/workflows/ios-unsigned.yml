                      }
                      VStack(alignment: .leading, spacing: 4) {
                          HStack {
                              Text("Detail")
                              Spacer()
                              Text(String(format: "%.0f %%", detail * 100))
                                  .foregroundColor(.secondary)
                                  .monospacedDigit()
                          }
                          Slider(value: $detail, in: 0...1, step: 0.05)
                      }
                      VStack(alignment: .leading, spacing: 4) {
                          HStack {
                              Text("Klarheit")
                              Spacer()
                              Text(String(format: "%.0f %%", clarity * 100))
                                  .foregroundColor(.secondary)
                                  .monospacedDigit()
                          }
                          Slider(value: $clarity, in: 0...1, step: 0.05)
                      }
                      VStack(alignment: .leading, spacing: 4) {
                          HStack {
                              Text("Rauschfilter (MPEG)")
                              Spacer()
                              Text(String(format: "%.0f %%", denoise * 100))
                                  .foregroundColor(.secondary)
                                  .monospacedDigit()
                          }
                          Slider(value: $denoise, in: 0...1, step: 0.05)
                      }
                      VStack(alignment: .leading, spacing: 4) {
                          HStack {
                              Text("Farbdynamik")
                              Spacer()
                              Text(String(format: "%.0f %%", vibrance * 100))
                                  .foregroundColor(.secondary)
                                  .monospacedDigit()
                          }
                          Slider(value: $vibrance, in: 0...1, step: 0.05)
                      }
                      VStack(alignment: .leading, spacing: 4) {
                          HStack {
                              Text("Sättigung")
