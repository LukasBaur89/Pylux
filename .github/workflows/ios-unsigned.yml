                          preset("Kino") {
                              level = 0.40; detail = 0.15; clarity = 0.08
                              gamma = 1.0; temp = 0.45; saturation = 0.5; contrast = 0.5
                              denoise = 0.30; pacing = true
                          }
                          preset("Standard") {
                              level = 0.65; detail = 0.30; clarity = 0.15
                              gamma = 1.0; temp = 0.5; saturation = 0.5; contrast = 0.5
                              denoise = 0.25; pacing = true
                          }
                          preset("Ultra") {
                              level = 0.90; detail = 0.55; clarity = 0.30
                              gamma = 1.0; temp = 0.5; saturation = 0.5; contrast = 0.55
                              denoise = 0.20; pacing = true
                          }
                          preset("Motion") {
                              level = 0.55; detail = 0.25; clarity = 0.05
                              gamma = 1.0; temp = 0.5; saturation = 0.5; contrast = 0.5
                              denoise = 0.35; pacing = true
                          }
                      }
                      Text("Bildschärfe").font(.headline)
                      VStack(alignment: .leading, spacing: 4) {
                          HStack {
                              Text("Bildschärfe")
